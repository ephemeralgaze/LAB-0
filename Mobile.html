<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAB-0 | MOBILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --fg: #FFFFFF;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-nav: rgba(255, 255, 255, 0.4); 
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
  --font-mono: "Space Mono", monospace;
  --player-ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  border-radius: 0 !important;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100vw;
  height: 100vh;
  background-color: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font-family: var(--font-body);
  font-weight: 300;
}

#boot-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1s var(--player-ease);
}

#boot-logo {
  font-family: var(--font-header);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0px;
  text-transform: uppercase;
  transition: transform 1.2s var(--player-ease), font-size 1.2s var(--player-ease), letter-spacing 1.2s var(--player-ease);
  z-index: 2100;
  will-change: transform;
}

.view-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: 48px; 
  transition: transform 0.8s var(--player-ease), opacity 0.8s var(--player-ease), filter 0.8s var(--player-ease);
  opacity: 0; 
}

.view-container.modal-open {
  opacity: 0.3;
  transform: scale(0.92) translateY(-20px);
  pointer-events: none;
}

.view-header {
  padding: 50px 25px 20px;
  border-bottom: 1px solid var(--border-color);
  z-index: 10;
  background: var(--bg);
}

.view-header h1 {
  font-family: var(--font-header);
  font-size: 1.2rem;
  letter-spacing: 0.15em;
  font-weight: 700;
  text-transform: uppercase;
  visibility: hidden; /* Placeholder for boot-logo to slide into */
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 48px;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-top: 1px solid var(--border-nav); 
  display: flex;
  z-index: 100;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: #444;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.4s var(--player-ease);
}

.nav-btn.active {
  color: var(--fg);
}

.nav-icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 1.5;
  fill: none;
}

.nav-label {
  font-size: 8px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.sections-wrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.section {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px);
  transition: transform 0.6s var(--player-ease), opacity 0.6s var(--player-ease);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.section.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

#section-home {
  background: #000;
  overflow: hidden;
}

#dot-matrix-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.project-list {
  display: flex;
  flex-direction: column;
}

.project-item {
  padding: 24px 25px;
  display: flex;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-color);
  transition: background 0.3s var(--player-ease), transform 0.3s var(--player-ease);
}

.project-item:active {
  background: rgba(255,255,255,0.05);
  transform: scale(0.98);
}

.project-id {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #333;
  width: 20px;
}

.project-name {
  flex: 1;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

#section-about {
  padding: 40px 25px;
}

.profile-card {
  display: flex;
  flex-direction: column;
  gap: 40px;
}

.avatar-row {
  display: flex;
  align-items: center;
  gap: 20px;
}

.avatar {
  width: 80px;
  height: 80px;
  border: 1px solid var(--fg);
  object-fit: cover;
  padding: 0;
}

.profile-names {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.p-name {
  font-family: var(--font-header);
  font-size: 14px;
  letter-spacing: 0.15em;
  font-weight: 700;
  text-transform: uppercase;
}

.p-handle {
  font-family: var(--font-mono);
  font-size: 9px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.spec-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.spec-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.spec-label {
  font-family: var(--font-mono);
  font-size: 8px;
  color: #333;
  text-transform: uppercase;
  letter-spacing: 0.2em;
}

.spec-value {
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--fg);
  font-weight: 400;
  letter-spacing: 0.02em;
}

.player-modal {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.8s var(--player-ease);
}

.player-modal.open {
  transform: translateY(0);
}

.drag-bar-container {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 10px;
  cursor: pointer;
}

.chevron-down {
  width: 24px;
  height: 24px;
  stroke: rgba(255, 255, 255, 0.4);
  stroke-width: 1.5;
  fill: none;
}

.player-content {
  flex: 1;
  padding: 30px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
}

.video-container {
  width: 100%;
  aspect-ratio: 16/9;
  background: #050505;
  border: 1px solid rgba(255, 255, 255, 0.4);
  overflow: hidden;
  height: auto;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-info {
  width: 100%;
  text-align: center;
}

.player-title {
  font-family: var(--font-header);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.player-controls {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 35px;
}

.scrubber-container {
  width: 100%;
}

.scrubber {
  -webkit-appearance: none;
  width: 100%;
  height: 2px;
  background: #111;
  outline: none;
}

.scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 8px;
  background: #FFF;
}

.time-row {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 8px;
  color: #222;
}

.transport-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
}

.control-btn {
  background: none;
  border: none;
  color: var(--fg);
  cursor: pointer;
  opacity: 0.9;
}

.control-btn:active {
  transform: scale(0.9);
}

.btn-play-pause {
  width: 48px;
  height: 48px;
}
</style>
</head>
<body>

<div id="boot-screen">
  <div id="boot-logo">LAB-<span id="boot-char">0</span></div>
</div>

<div class="view-container" id="main-view">
  <div class="view-header">
    <h1 id="mobile-logo-target">LAB-0</h1>
  </div>

  <div class="sections-wrapper">
    <section id="section-home" class="section active">
      <canvas id="dot-matrix-canvas"></canvas>
    </section>

    <section id="section-playlist" class="section">
      <div class="project-list">
        <div class="project-item" onclick="openPlayer('INTRO', '', '', 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">

        <div class="spec-list">
          <div class="spec-item"><span class="spec-label">Education</span><span class="spec-value">Animation Production Technology</span></div>

          <div class="spec-item"><span class="spec-label">Age</span><span class="spec-value">21</span></div>
          <div class="spec-item"><span class="spec-label">Contact</span><span class="spec-value">a3445886718@gmail.com</span></div>
          <div class="spec-item"><span class="spec-label">Status</span><span class="spec-value">LAB_ACTIVE // STABLE</span></div>
        </div>
      </div>

</div>

<nav class="bottom-nav" id="bottom-dock">
  <div class="nav-btn active" onclick="switchSection('home')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    <span class="nav-label">Home</span>
  </div>
  <div class="nav-btn" onclick="switchSection('playlist')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    <span class="nav-label">Library</span>
  </div>
  <div class="nav-btn" onclick="switchSection('about')">
    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    <span class="nav-label">System</span>

</nav>

<div id="player-modal" class="player-modal">
  <div class="drag-bar-container" id="modal-drag" onclick="closePlayer()">
    <svg class="chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg>
  </div>
  <div class="player-content">
    <div class="video-container">
      <video id="player-video" playsinline loop muted>
        <source src="" type="video/mp4">
      </video>

    <div class="player-info">
      <div id="p-title" class="player-title">--</div>
    </div>
    <div class="player-controls">
      <div class="scrubber-container">
        <input type="range" id="p-scrubber" class="scrubber" value="0" min="0" step="0.1">
        <div class="time-row"><span id="p-current">0:00</span><span id="p-duration">0:00</span></div>
      </div>
      <div class="transport-controls">
        <button id="p-play" class="control-btn btn-play-pause">
          <svg id="svg-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
          <svg id="svg-pause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function scrambleText(element, finalString, duration) {
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$';
  const originalText = element.innerText;
  const start = performance.now();
  function update(time) {
    const elapsed = time - start;
    const progress = Math.min(elapsed / duration, 1);
    let current = '';
    const finalLength = finalString.length;
    const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
    for (let i = 0; i < currentLength; i++) {
      if (Math.random() < progress) current += finalString[i] || '';
      else current += chars[Math.floor(Math.random() * chars.length)];
    }
    element.innerText = current;
    if (progress < 1) requestAnimationFrame(update);
    else element.innerText = finalString;
  }
  requestAnimationFrame(update);
}

async function runBootSequence() {
  const bootScreen = document.getElementById('boot-screen');
  const bootChar = document.getElementById('boot-char');
  const bootLogo = document.getElementById('boot-logo');
  const mainView = document.getElementById('main-view');
  const target = document.getElementById('mobile-logo-target');
  
  await sleep(600);
  scrambleText(bootChar, 'MOBILE', 800);
  await sleep(1800);
  scrambleText(bootChar, '0', 1000);
  
  // Get positions for "One-Take" transition
  const logoRect = bootLogo.getBoundingClientRect();
  const targetRect = target.getBoundingClientRect();
  
  const deltaX = targetRect.left - logoRect.left;
  const deltaY = targetRect.top - logoRect.top;
  const scale = targetRect.height / logoRect.height;
  
  // Continuous movement to target position
  bootLogo.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scale})`;
  bootLogo.style.letterSpacing = '0.15em';
  
  await sleep(800);
  bootScreen.style.opacity = '0';
  mainView.style.opacity = '1';
  
  await sleep(1000);
  // Seamlessly swap boot-logo with actual logo
  target.style.visibility = 'visible';
  bootLogo.style.display = 'none';
  bootScreen.style.display = 'none';
}

function switchSection(id) {
  const sections = document.querySelectorAll('.section');
  const btns = document.querySelectorAll('.nav-btn');
  sections.forEach(s => s.classList.remove('active'));
  btns.forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  if (id === 'home') btns[0].classList.add('active');
  else if (id === 'playlist') btns[1].classList.add('active');
  else if (id === 'about') btns[2].classList.add('active');
}

(function() {
  const canvas = document.getElementById("dot-matrix-canvas");
  const ctx = canvas.getContext("2d");
  let dots = [];
  let width, height, dpr;
  const GRID_SIZE = 30;
  const DOT_RADIUS = 0.8;

  function init() {
    dpr = window.devicePixelRatio || 1;
    width = canvas.parentElement.clientWidth;
    height = canvas.parentElement.clientHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    ctx.scale(dpr, dpr);
    dots = [];
    const cols = Math.ceil(width / GRID_SIZE), rows = Math.ceil(height / GRID_SIZE);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        dots.push({ x: i * GRID_SIZE + GRID_SIZE / 2, y: j * GRID_SIZE + GRID_SIZE / 2, phase: Math.random() * Math.PI * 2, freq: 0.02 + Math.random() * 0.03, maxOpacity: 0.02 + Math.random() * 0.20 });
      }
    }
  }

  function draw(time) {
    if (document.getElementById('section-home').classList.contains('active')) {
      ctx.clearRect(0, 0, width, height);
      dots.forEach(dot => {
        const opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2); ctx.fillStyle = "rgba(255, 255, 255, " + opacity.toFixed(3) + ")"; ctx.fill();
      });
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", init); init(); requestAnimationFrame(draw);
})();

const playerModal = document.getElementById('player-modal');
const mainView = document.getElementById('main-view');
const playerVideo = document.getElementById('player-video');
const scrubber = document.getElementById('p-scrubber');

function openPlayer(title, subtitle, tag, url) {
  document.getElementById('p-title').innerText = title;
  playerVideo.src = url;
  playerModal.classList.add('open');
  mainView.classList.add('modal-open');
  playerVideo.play();
}

function closePlayer() {
  playerModal.classList.remove('open');
  mainView.classList.remove('modal-open');
  playerVideo.pause();
  playerVideo.src = "";
}

document.getElementById('p-play').addEventListener('click', () => {
  if (playerVideo.paused) { playerVideo.play(); document.getElementById('svg-play').style.display = 'none'; document.getElementById('svg-pause').style.display = 'block'; }
  else { playerVideo.pause(); document.getElementById('svg-play').style.display = 'block'; document.getElementById('svg-pause').style.display = 'none'; }
});

playerVideo.addEventListener('timeupdate', () => {
  if (!scrubber.dragging) {
    scrubber.value = playerVideo.currentTime;
    document.getElementById('p-current').innerText = Math.floor(playerVideo.currentTime / 60) + ":" + String(Math.floor(playerVideo.currentTime % 60)).padStart(2, '0');
  }
});

playerVideo.addEventListener('loadedmetadata', () => {
  scrubber.max = playerVideo.duration;
  document.getElementById('p-current').innerText = "0:00";
  document.getElementById('p-duration').innerText = Math.floor(playerVideo.duration / 60) + ":" + String(Math.floor(playerVideo.duration % 60)).padStart(2, '0');
});

scrubber.addEventListener('input', () => { scrubber.dragging = true; playerVideo.currentTime = scrubber.value; });
scrubber.addEventListener('change', () => { scrubber.dragging = false; });

let startY = 0, currentY = 0;
const dragBar = document.getElementById('modal-drag');
dragBar.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
dragBar.addEventListener('touchmove', (e) => {
  currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  if (diff > 0) { playerModal.style.transform = `translateY(${diff}px)`; playerModal.style.transition = 'none'; }
});
dragBar.addEventListener('touchend', () => {
  const diff = currentY - startY;
  playerModal.style.transition = 'transform 0.8s var(--player-ease)';
  if (diff > 150) closePlayer();
  else playerModal.style.transform = 'translateY(0)';
  startY = 0; currentY = 0;
});

window.onload = () => {
  runBootSequence();
};
</script>
