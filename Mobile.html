<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 | MOBILE TELEMETRY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --fg: #FFFFFF;
            --border: 1px solid rgba(255, 255, 255, 0.15);
            --font-header: 'Syncopate', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            /* Subtle Checkered Grid Background */
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.01) 25%, transparent 25%), 
                linear-gradient(-45deg, rgba(255,255,255,0.01) 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.01) 75%), 
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.01) 75%);
            background-size: 40px 40px;
            background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
        }

        header {
            border-bottom: var(--border);
            padding: 25px;
            z-index: 10;
            background: rgba(5,5,5,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-family: var(--font-header);
            font-size: 9px;
            letter-spacing: 3px;
            opacity: 0.8;
        }

        /* Module Switcher */
        .module-switcher {
            display: flex;
            border-bottom: var(--border);
            background: transparent;
        }

        .module-tab {
            flex: 1;
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 9px;
            text-align: center;
            text-transform: uppercase;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .module-tab.active {
            opacity: 1;
            letter-spacing: 1px;
        }

        /* Main Content */
        .main-section {
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .module-content {
            display: none;
            width: 100%;
        }

        .module-content.active {
            display: block;
        }

        .canvas-container {
            height: 300px;
            width: 100%;
            position: relative;
        }

        #niagara-canvas {
            width: 100%;
            height: 100%;
        }

        /* Vector Field Overlay */
        .vf-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(5,5,5,0.7);
            padding: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            font-family: var(--font-mono);
            font-size: 8px;
            color: rgba(255,255,255,0.7);
            z-index: 15;
        }

        /* Simplified Mobile View */
        .placeholder-view {
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-desc-block {
            text-align: left;
        }

        .desc-title {
            font-family: var(--font-header);
            font-size: 14px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .desc-body {
            font-family: var(--font-mono);
            font-size: 10px;
            line-height: 1.8;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }

        /* High-Frequency Time Display */
        .time-display {
            padding: 20px 25px;
            border-top: var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-label {
            font-family: var(--font-mono);
            font-size: 8px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 1px;
        }

        .time-value {
            font-family: var(--font-mono);
            font-size: 16px;
            color: #FFFFFF;
        }

        /* Terminal Feed */
        .terminal-section {
            padding: 25px;
            flex-grow: 1;
            background: transparent;
        }

        .panel-title {
            font-family: var(--font-header);
            font-size: 8px;
            color: rgba(255,255,255,0.2);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        #diag-terminal {
            font-family: var(--font-mono);
            font-size: 9px;
            color: rgba(255,255,255,0.4);
            white-space: pre-wrap;
            line-height: 1.6;
        }

        footer {
            border-top: var(--border);
            padding: 20px 25px;
            font-family: var(--font-mono);
            font-size: 8px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <h1>LAB-0 // MOBILE_TELEMETRY</h1>
        <div style="font-size: 8px; color: #00FF00; opacity: 0.5;">LIVE</div>
    </header>

    <nav class="module-switcher">
        <div class="module-tab active" onclick="switchModule('01')">LAB_01</div>
        <div class="module-tab" onclick="switchModule('02')">VFX_02</div>
    </nav>

    <section class="main-section">
        <div id="content-01" class="module-content active">
            <div class="canvas-container">
                <div class="vf-overlay">
                    <div id="tele-pos">POS: 000, 000</div>
                    <div id="tele-vel">VEL: 0.000</div>
                    <div id="tele-alloc">[VIRTUAL_BUFFER_ALLOC]</div>
                </div>
                <canvas id="niagara-canvas"></canvas>
            </div>
        </div>
        <div id="content-02" class="module-content">
            <div class="placeholder-view">
                <div class="video-box">
                    <div style="font-family: var(--font-mono); font-size: 9px; opacity: 0.2;">[ PENDING_SIGNAL ]</div>
                </div>
                <div class="video-desc-block">
                    <div class="desc-title">NS_FOUNTAIN</div>
                    <div class="desc-body">
                        NIAGARA PARTICLE SYSTEM. HLSL INTEGRATION. DYNAMIC ALPHA CURVE VISUALIZATION.
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="time-display">
        <div class="time-label">UTC_TELEMETRY</div>
        <div class="time-value" id="live-clock">00:00:00:00</div>
    </div>

    <section class="terminal-section">
        <div class="panel-title">DIAGNOSTICS_FEED</div>
        <div id="diag-terminal"></div>
    </section>

    <footer>
        STRICT_0PX_B_RADIUS // UE_5.2.4
    </footer>

    <script>
        function switchModule(id) {
            document.querySelectorAll('.module-tab').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.module-content').forEach(el => el.classList.remove('active'));
            document.getElementById('content-' + id).classList.add('active');
        }

        const terminal = document.getElementById('diag-terminal');
        const logs = [
            "[SYS] CORE_INIT...",
            "[VFX] NS_FOUNTAIN_LOAD...",
            "[GPU] SHADERS_OK...",
            "[MEM] BUFFER_ALLOC..."
        ];

        function addLog() {
            const log = logs[Math.floor(Math.random() * logs.length)];
            const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
            const lines = terminal.innerHTML.split('\n');
            terminal.innerHTML += `[${time}] ${log}\n`;
            if (lines.length > 8) terminal.innerHTML = lines.slice(lines.length - 8).join('\n');
        }
        setInterval(addLog, 2500);

        // Vector Field Implementation
        const canvas = document.getElementById('niagara-canvas');
        const ctx = canvas.getContext('2d');
        const telePos = document.getElementById('tele-pos');
        const teleVel = document.getElementById('tele-vel');

        let particles = [];
        let mouse = { x: 0, y: 0 };
        let grid = [];
        const resolution = 25;
        let cols, rows;

        function resize() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            cols = Math.floor(canvas.width / resolution) + 1;
            rows = Math.floor(canvas.height / resolution) + 1;
            initParticles();
        }

        window.addEventListener('resize', resize);
        
        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.touches[0].clientX - rect.left;
            mouse.y = e.touches[0].clientY - rect.top;
            telePos.innerText = `POS: ${Math.floor(mouse.x).toString().padStart(3, '0')}, ${Math.floor(mouse.y).toString().padStart(3, '0')}`;
        });

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            telePos.innerText = `POS: ${Math.floor(mouse.x).toString().padStart(3, '0')}, ${Math.floor(mouse.y).toString().padStart(3, '0')}`;
        });

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.prevX = this.x;
                this.prevY = this.y;
                this.velX = 0;
                this.velY = 0;
                this.accX = 0;
                this.accY = 0;
                this.maxSpeed = 1.5 + Math.random() * 1.5;
                this.life = 80 + Math.random() * 80;
            }
            update(field) {
                const c = Math.floor(this.x / resolution);
                const r = Math.floor(this.y / resolution);
                if (c >= 0 && c < cols && r >= 0 && r < rows) {
                    const force = field[c][r];
                    this.accX += force.x;
                    this.accY += force.y;
                }

                // Mouse Force
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 100) {
                    const mForce = (100 - dist) / 1000;
                    this.accX += (dx / dist) * mForce;
                    this.accY += (dy / dist) * mForce;
                }

                this.prevX = this.x;
                this.prevY = this.y;
                this.velX += this.accX;
                this.velY += this.accY;
                
                const speed = Math.sqrt(this.velX**2 + this.velY**2);
                if (speed > this.maxSpeed) {
                    this.velX = (this.velX / speed) * this.maxSpeed;
                    this.velY = (this.velY / speed) * this.maxSpeed;
                }

                this.x += this.velX;
                this.y += this.velY;
                this.accX = 0;
                this.accY = 0;
                this.life--;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height || this.life <= 0) {
                    this.init();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.prevX, this.prevY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, this.life/20)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        function initParticles() {
            particles = [];
            const count = (canvas.width * canvas.height) / 3000;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        let time = 0;
        function animate() {
            if (document.getElementById('content-01').classList.contains('active')) {
                time += 0.005;
                grid = [];
                for (let i = 0; i < cols; i++) {
                    grid[i] = [];
                    for (let j = 0; j < rows; j++) {
                        const angle = (Math.sin(i * 0.15 + time) + Math.cos(j * 0.15 + time)) * Math.PI;
                        grid[i][j] = { x: Math.cos(angle) * 0.1, y: Math.sin(angle) * 0.1 };
                    }
                }

                ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let avgVel = 0;
                particles.forEach(p => {
                    p.update(grid);
                    p.draw();
                    avgVel += Math.sqrt(p.velX**2 + p.velY**2);
                });
                
                teleVel.innerText = `VEL: ${(avgVel / (particles.length || 1)).toFixed(3)}`;
            }
            requestAnimationFrame(animate);
        }

        resize();
        animate();

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2);
            document.getElementById('live-clock').innerText = `${h}:${m}:${s}:${ms}`;
        }
        setInterval(updateClock, 50);
    </script>
</body>
</html>
