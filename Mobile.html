<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 // MOBILE COMMAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --overlay-bg: #050505;
            --fg: #FFFFFF;
            --muted: #666666;
            --font-header: 'Syncopate', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-smooth: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Z-Index / Layer Ordering --- */
        #dot-matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            opacity: 0.85;
            z-index: 2;
            pointer-events: none;
        }

        /* --- Header --- */
        header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            background: var(--bg);
            position: relative;
        }

        #logo {
            font-family: var(--font-header);
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- Accordion --- */
        .category-header, .about-link {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--fg);
            padding: 12px 0;
            transition: color 0.3s ease;
            text-decoration: none;
        }

        .arrow-icon {
            width: 8px;
            height: 8px;
            transition: transform var(--transition-smooth);
            fill: currentColor;
        }

        .category-header.expanded .arrow-icon {
            transform: rotate(90deg);
        }

        .project-list-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows var(--transition-smooth);
            overflow: hidden;
            padding-left: 20px;
        }

        .category-header.expanded ~ .project-list-wrapper {
            grid-template-rows: 1fr;
        }

        .project-list {
            min-height: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .project-item {
            font-family: var(--font-mono);
            font-size: 11px;
            padding: 10px 0;
            cursor: pointer;
            color: var(--muted);
            transition: 
                transform var(--transition-smooth), 
                opacity var(--transition-smooth), 
                color var(--transition-smooth),
                font-size var(--transition-smooth),
                padding var(--transition-smooth);
            text-transform: uppercase;
            white-space: nowrap;
            transform-origin: left center;
        }

        .project-item.active {
            color: var(--fg);
            font-weight: 700;
        }

        /* --- One-Take Mobile Logic --- */
        .category-header:not(.expanded) ~ .project-list-wrapper .project-item:not(.active) {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }

        .category-header:not(.expanded) ~ .project-list-wrapper .project-item.active {
            font-size: 8px;
            color: var(--muted);
            padding: 0;
            transform: translateY(-38px);
        }

        .category-header:not(.expanded).has-selection ~ .project-list-wrapper {
            grid-template-rows: 15px;
        }

        /* --- Preview / Split View --- */
        #preview-section {
            position: fixed;
            top: 60px;
            bottom: 40px;
            left: 0;
            right: 0;
            background: var(--bg);
            z-index: 100;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #video-container-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-bottom: 1px solid #FFF;
            position: relative;
            cursor: pointer;
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #metadata-container {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: var(--overlay-bg);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #project-title {
            font-family: var(--font-header);
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #project-desc {
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.8;
            color: var(--muted);
            text-transform: uppercase;
        }

        #close-trigger-btn {
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 10px;
            width: fit-content;
            margin-top: auto;
            cursor: pointer;
            letter-spacing: 2px;
        }

        /* --- Player Modal (Apple Music Style) --- */
        #player-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform var(--transition-smooth);
        }

        #player-modal.active {
            transform: translateY(0);
        }

        #player-header {
            height: 80px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        #player-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #player-avatar {
            width: 40px;
            height: 40px;
            border: 1px solid #FFF;
            object-fit: cover;
        }

        #player-titles {
            display: flex;
            flex-direction: column;
        }

        #player-project-name {
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #player-username {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
        }

        #player-dismiss {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        #player-video-container {
            width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-controls {
            padding: 40px 25px 60px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .player-slider-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-slider-track {
            width: 100%;
            height: 1px;
            background: #333;
            position: relative;
            cursor: pointer;
        }

        .player-slider-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #FFF;
            width: 0%;
        }

        .player-time-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
        }

        #player-playback-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        .playback-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .playback-btn:active {
            opacity: 0.5;
        }

        .player-volume-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 10px;
        }

        .volume-icon {
            width: 16px;
            height: 16px;
            fill: var(--muted);
        }

        /* --- Footer HUD --- */
        footer {
            height: 40px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            background: var(--bg);
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .visible { display: flex !important; opacity: 1 !important; }
    </style>
</head>
<body>

    <canvas id="dot-matrix-canvas"></canvas>
    <div id="bg-overlay"></div>

    <header>
        <div id="logo">LAB-0</div>
    </header>

    <main id="main-content">
        <div id="projects-section">
            <div id="projects-header" class="category-header" onclick="toggleCategory(this)">
                <svg class="arrow-icon" viewBox="0 0 10 10">
                    <path d="M2 1 L8 5 L2 9 Z" />
                </svg>
                <span>Projects</span>
            </div>
            <div class="project-list-wrapper">
                <ul class="project-list">
                    <li class="project-item" data-id="1" onclick="selectProject(1)">[01] LEVEL_01</li>
                    <li class="project-item" data-id="2" onclick="selectProject(2)">[02] LEVEL_02</li>
                    <li class="project-item" data-id="3" onclick="selectProject(3)">[03] LEVEL_03</li>
                </ul>
            </div>
        </div>
        <a href="#" class="about-link" onclick="handleAboutClick(event)">
            <svg style="width:8px; height:8px; visibility:hidden;"></svg>
            <span>About</span>
        </a>
    </main>

    <div id="preview-section">
        <div id="video-container-wrapper" onclick="openPlayer()">
            <video id="main-video" playsinline crossorigin="anonymous" muted loop>
                <source id="video-src" src="" type="video/mp4">
            </video>
        </div>
        <div id="metadata-container">
            <h2 id="project-title"></h2>
            <p id="project-desc"></p>
            <button id="close-trigger-btn" onclick="closeProject()">EXIT_STATION [X]</button>
        </div>
    </div>

    <div id="player-modal">
        <div id="player-header">
            <div id="player-user-info">
                <img id="player-avatar" src="https://github.com/ephemeralgaze.png" alt="Avatar">
                <div id="player-titles">
                    <span id="player-project-name">PROJECT_NAME</span>
                    <span id="player-username">ephemeralgaze</span>
                </div>
            </div>
            <div id="player-dismiss" onclick="closePlayer()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            </div>
        </div>
        <div id="player-content">
            <div id="player-video-container">
                <!-- Video will be moved here when player is open -->
            </div>
        </div>
        <div id="player-controls">
            <div class="player-slider-row">
                <div class="player-slider-track" id="progress-track" onclick="seekVideo(event)">
                    <div class="player-slider-fill" id="progress-fill"></div>
                </div>
                <div class="player-time-labels">
                    <span id="time-elapsed">0:00</span>
                    <span id="time-remaining">-0:00</span>
                </div>
            </div>

            <div id="player-playback-row">
                <button class="playback-btn" onclick="skip(-5)">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>
                <button class="playback-btn" onclick="togglePlay()" id="play-pause-btn">
                    <svg id="play-icon" width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pause-icon" width="48" height="48" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <button class="playback-btn" onclick="skip(5)">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <div class="player-volume-row">
                <svg class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <div class="player-slider-track" style="flex:1">
                    <div class="player-slider-fill" style="width:70%"></div>
                </div>
                <svg class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </div>
        </div>
    </div>

    <footer>
        <div id="hud-status">SYSTEM_ACTIVE // STABLE</div>
        <div id="hud-clock">00:00:00</div>
    </footer>

    <script>
        const projects = {
            1: { title: "LEVEL_01 // NIAGARA", desc: "INITIAL PARTICLE COLLISION TESTS. ANALYZING KINETIC ENERGY TRANSFER IN FLUID ENVIRONMENTS.", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            2: { title: "LEVEL_02 // GRAVITY", desc: "STRESS TESTING POINT-GRAVITY NODES. OBSERVING ORBITAL DECAY IN CONTROLLED VACUUM.", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            3: { title: "LEVEL_03 // WIND", desc: "INTEGRATION OF DIRECTIONAL WIND FIELDS. MEASURING AERODYNAMIC RESISTANCE ON PARTICLE AGGREGATES.", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
        };

        const canvas = document.getElementById('dot-matrix-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = 'rgba(255, 255, 255, ' + (Math.random() * 0.4 + 0.1) + ')';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }

        function toggleCategory(header) {
            header.classList.toggle('expanded');
        }

        function handleAboutClick(e) {
            e.preventDefault();
            closeProject();
        }

        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('hud-clock').innerText = `${h}:${m}:${s}`;
        }

        let currentActiveId = null;

        function selectProject(id) {
            currentActiveId = id;
            const items = document.querySelectorAll('.project-item');
            const preview = document.getElementById('preview-section');
            const title = document.getElementById('project-title');
            const desc = document.getElementById('project-desc');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            const header = document.getElementById('projects-header');
            const playerName = document.getElementById('player-project-name');

            items.forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.getAttribute('data-id')) === id) {
                    item.classList.add('active');
                }
            });

            header.classList.add('has-selection');
            const data = projects[id];
            title.innerText = data.title;
            desc.innerText = data.desc;
            playerName.innerText = data.title.split(' // ')[0];
            source.src = data.video;

            preview.classList.add('visible');
            video.load();
            video.play();
        }

        function closeProject() {
            const preview = document.getElementById('preview-section');
            const video = document.getElementById('main-video');
            const header = document.getElementById('projects-header');

            preview.classList.remove('visible');
            document.querySelectorAll('.project-item').forEach(i => i.classList.remove('active'));
            header.classList.remove('has-selection');
            video.pause();
            currentActiveId = null;
        }

        /* --- Player Modal Logic --- */
        const playerModal = document.getElementById('player-modal');
        const video = document.getElementById('main-video');
        const playerVideoContainer = document.getElementById('player-video-container');
        const previewVideoContainer = document.getElementById('video-container-wrapper');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressFill = document.getElementById('progress-fill');
        const timeElapsed = document.getElementById('time-elapsed');
        const timeRemaining = document.getElementById('time-remaining');

        function openPlayer() {
            if (!currentActiveId) return;
            playerVideoContainer.appendChild(video);
            video.muted = false;
            playerModal.classList.add('active');
            updateUI();
        }

        function closePlayer() {
            previewVideoContainer.appendChild(video);
            video.muted = true;
            playerModal.classList.remove('active');
        }

        function togglePlay() {
            if (video.paused) video.play();
            else video.pause();
            updateUI();
        }

        function skip(time) {
            video.currentTime += time;
        }

        function seekVideo(e) {
            const track = document.getElementById('progress-track');
            const rect = track.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function updateUI() {
            if (video.paused) {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            } else {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }
        }

        video.addEventListener('timeupdate', () => {
            const progress = (video.currentTime / video.duration) * 100;
            progressFill.style.width = `${progress}%`;
            timeElapsed.innerText = formatTime(video.currentTime);
            timeRemaining.innerText = `-${formatTime(video.duration - video.currentTime)}`;
        });

        video.addEventListener('play', updateUI);
        video.addEventListener('pause', updateUI);

        window.onload = () => {
            initParticles();
            animate();
            setInterval(updateClock, 1000);
            updateClock();
        };

        window.onresize = initParticles;
    </script>
</body>
</html>
