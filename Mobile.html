<style>
:root {
  --bg: #000000;
  --fg: #FFFFFF;
  --border-color: rgba(255, 255, 255, 0.08);
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  border-radius: 0 !important;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100vw;

}

#boot-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 1s var(--player-ease);
  pointer-events: none; /* Crucial: Allow interaction through once faded */
}

#boot-logo {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  text-transform: uppercase;
  z-index: 2100;
  white-space: nowrap;
  transition: transform 1.2s var(--player-ease), font-size 1.2s var(--player-ease), letter-spacing 1.2s var(--player-ease);
  will-change: transform;
}

.view-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: 84px; 
  opacity: 0;
  transition: transform 0.6s var(--player-ease), opacity 0.6s var(--player-ease);
}

.view-container.modal-open {

  pointer-events: none;
}

.view-header {

}

#logo-placeholder {

}

.bottom-nav {

.time-row {

.transport-controls {

.control-btn {

.control-btn:active {

</style>

<script>
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function scrambleText(element, finalString, duration) {
    return new Promise(resolve => {
        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$';
        const originalText = element.innerText;
        const start = performance.now();
        function update(time) {
            const elapsed = time - start;
            const progress = Math.min(elapsed / duration, 1);
            let current = '';
            const finalLength = finalString.length;
            const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
            for (let i = 0; i < currentLength; i++) {
                if (Math.random() < progress) current += finalString[i] || '';
                else current += chars[Math.floor(Math.random() * chars.length)];
            }
            element.innerText = current;
            if (progress < 1) requestAnimationFrame(update);
            else { element.innerText = finalString; resolve(); }
        }
        requestAnimationFrame(update);
    });
}

async function runBootSequence() {
    const bg = document.getElementById('boot-screen');
    const logo = document.getElementById('boot-logo');
    const targetChar = document.getElementById('boot-char');
    const anchor = document.getElementById('logo-placeholder');
    const mainView = document.getElementById('main-view');

    await sleep(600);
    // 1. Scramble to 'MOBILE'
    await scrambleText(targetChar, 'MOBILE', 800);
    
    // 2. Pause for 0.3s
    await sleep(300);

    // 3. Calculate anchor
    const rect = anchor.getBoundingClientRect();
    const targetX = rect.left + (rect.width / 2);
    const targetY = rect.top + (rect.height / 2);
    const deltaX = targetX - (window.innerWidth / 2);
    const deltaY = targetY - (window.innerHeight / 2);

    // 4. Slide to top-left WHILE changing to '0'
    logo.style.letterSpacing = '2px';
    logo.style.fontSize = '1.4rem';
    logo.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
    
    // Smooth text swap during transition
    setTimeout(() => {
        scrambleText(targetChar, '0', 600);
    }, 200);

    await sleep(1000);
    
    // 5. Fade boot screen and reveal app
    mainView.style.opacity = '1';
    bg.style.opacity = '0';
    
    // Logo remains permanently at target coordinates because we never hide it or change its transform.
    // The boot-screen overlay fades but stays at z-index 2000, pointer-events: none ensures interaction.
}

function switchSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  const btns = document.querySelectorAll('.nav-btn');
  if (id === 'home') btns[0].classList.add('active');
  else if (id === 'playlist') btns[1].classList.add('active');
  else if (id === 'about') btns[2].classList.add('active');
}

(function() {
  const canvas = document.getElementById("dot-matrix-canvas");
  const ctx = canvas.getContext("2d");
  let dots = [];
  let width, height, dpr;
  const GRID_SIZE = 30;
  const DOT_RADIUS = 1.0;

  function init() {
    dpr = window.devicePixelRatio || 1;
    width = canvas.parentElement.clientWidth;
    height = canvas.parentElement.clientHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    ctx.scale(dpr, dpr);
    dots = [];
    const cols = Math.ceil(width / GRID_SIZE), rows = Math.ceil(height / GRID_SIZE);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        dots.push({ x: i * GRID_SIZE + GRID_SIZE / 2, y: j * GRID_SIZE + GRID_SIZE / 2, phase: Math.random() * Math.PI * 2, freq: 0.02 + Math.random() * 0.03, maxOpacity: 0.02 + Math.random() * 0.22 });
      }
    }
  }

  function draw(time) {
    if (document.getElementById('section-home').classList.contains('active')) {
      ctx.clearRect(0, 0, width, height);
      dots.forEach(dot => {
        const opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2); ctx.fillStyle = "rgba(255, 255, 255, " + opacity.toFixed(3) + ")"; ctx.fill();
      });
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", init); init(); requestAnimationFrame(draw);
})();

const playerModal = document.getElementById('player-modal');
const mainView = document.getElementById('main-view');
const playerVideo = document.getElementById('player-video');
const scrubber = document.getElementById('p-scrubber');

function openPlayer(title, subtitle, tag, url) {
  document.getElementById('p-title').innerText = title;
  document.getElementById('p-subtitle').innerText = subtitle;
  playerVideo.src = url;
  playerModal.classList.add('open');
  mainView.classList.add('modal-open');
  playerVideo.play();
}

function closePlayer() {
  playerModal.classList.remove('open');
  mainView.classList.remove('modal-open');
  playerVideo.pause();
  playerVideo.src = "";
  playerModal.style.transform = '';
}

document.getElementById('p-play').addEventListener('click', () => {
  if (playerVideo.paused) { playerVideo.play(); document.getElementById('svg-play').style.display = 'none'; document.getElementById('svg-pause').style.display = 'block'; }
  else { playerVideo.pause(); document.getElementById('svg-play').style.display = 'block'; document.getElementById('svg-pause').style.display = 'none'; }
});

playerVideo.addEventListener('timeupdate', () => {
  if (!scrubber.dragging) {
    scrubber.value = playerVideo.currentTime;
    document.getElementById('p-current').innerText = Math.floor(playerVideo.currentTime / 60) + ":" + String(Math.floor(playerVideo.currentTime % 60)).padStart(2, '0');
  }
});

playerVideo.addEventListener('loadedmetadata', () => {
  scrubber.max = playerVideo.duration;
  document.getElementById('p-duration').innerText = Math.floor(playerVideo.duration / 60) + ":" + String(Math.floor(playerVideo.duration % 60)).padStart(2, '0');
});

scrubber.addEventListener('input', () => { scrubber.dragging = true; playerVideo.currentTime = scrubber.value; });
scrubber.addEventListener('change', () => { scrubber.dragging = false; });

const modalDrag = document.getElementById('modal-drag');
modalDrag.addEventListener('click', (e) => {
    e.stopPropagation();
    closePlayer();
});

let startY = 0, currentY = 0;
modalDrag.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
modalDrag.addEventListener('touchmove', (e) => {
  currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  if (diff > 0) { playerModal.style.transform = `translateY(${diff}px)`; playerModal.style.transition = 'none'; }
});
modalDrag.addEventListener('touchend', () => {
  const diff = currentY - startY;
  playerModal.style.transition = 'transform 0.6s var(--player-ease)';
  if (diff > 150) closePlayer();
  else playerModal.style.transform = 'translateY(0)';
  startY = 0; currentY = 0;
});

window.onload = runBootSequence;
</script>
