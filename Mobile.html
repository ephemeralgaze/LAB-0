<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAB-0 | MOBILE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000000;
  --fg: #FFFFFF;
  --border-color: rgba(255, 255, 255, 0.1);
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
  --font-mono: "Space Mono", monospace;
  --player-ease: cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  border-radius: 0 !important;
  -webkit-tap-highlight-color: transparent;
}

body, html {
  width: 100vw;
  height: 100vh;
  background-color: var(--bg);
  color: var(--fg);
  overflow: hidden;
  font-family: var(--font-body);
}

/* Base View Layout */
.view-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: 80px; 
  transition: transform 0.6s var(--player-ease), opacity 0.6s var(--player-ease);
}

.view-container.modal-open {
  opacity: 0;
  pointer-events: none;
}

.view-container.modal-open .col-left { transform: translateX(-30px); }
.view-container.modal-open .col-right { transform: translateX(30px); }

.view-header {
  padding: 40px 20px 10px;
}

.view-header h1 {
  font-family: var(--font-header);
  font-size: 1.8rem;
  letter-spacing: -1px;
}

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 80px;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-color);
  display: flex;
  z-index: 100;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #888;
  text-decoration: none;
  cursor: pointer;
  transition: color 0.3s ease;
}

.nav-btn.active {
  color: var(--fg);
}

.nav-icon {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.nav-label {
  font-size: 10px;
  font-family: var(--font-mono);
  text-transform: uppercase;
}

/* Sections */
.section {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.section.active {
  display: flex;
  flex-direction: column;
}

/* Home - Pure Dot Matrix */
#section-home {
  padding: 0;
  background: #000;
  position: relative;
  overflow: hidden;
}

#dot-matrix-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* About Section Styles */
.profile-card {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding-bottom: 20px;
}

.avatar-row {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 64px;
  height: 64px;
  border: 1px solid var(--fg);
  object-fit: cover;
}

.profile-names {
  display: flex;
  flex-direction: column;
}

.p-name {
  font-family: var(--font-header);
  font-size: 14px;
  letter-spacing: 1px;
}

.p-handle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #888;
}

.spec-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
}

.spec-item {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  padding-bottom: 8px;
}

.spec-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
}

.spec-value {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--fg);
  text-align: right;
  max-width: 60%;
}

/* Playlist / Library */
.project-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border-color);
}

.project-item {
  background: var(--bg);
  padding: 15px 0;
  display: flex;
  align-items: center;
  gap: 15px;
  cursor: pointer;
}

.project-id {
  font-family: var(--font-mono);
  font-size: 12px;
  color: #555;
  width: 30px;
}

.project-name {
  flex: 1;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 16px;
}

/* Player Modal */
.player-modal {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.6s var(--player-ease);
  pointer-events: auto;
}

.player-modal.open {
  transform: translateY(0);
}

.drag-bar-container {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.drag-bar {
  width: 40px;
  height: 4px;
  background: rgba(255, 255, 255, 0.3);
}

.close-player-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  color: #FFF;
  font-family: var(--font-mono);
  font-size: 14px;
  padding: 10px;
  z-index: 1100;
  cursor: pointer;
}

.player-content {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
}

.video-container {
  width: 100%;
  aspect-ratio: 1/1;
  background: #111;
  border: 1px solid var(--border-color);
  position: relative;
  overflow: hidden;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.player-info {
  width: 100%;
  text-align: left;
}

.player-title {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 22px;
  margin-bottom: 4px;
}

.player-subtitle {
  font-family: var(--font-body);
  font-size: 16px;
  color: #888;
}

.player-controls {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.scrubber-container {
  width: 100%;
}

.scrubber {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.1);
  outline: none;
}

.scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: #FFF;
}

.time-row {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: #666;
}

.transport-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 20px 0;
}

.control-btn {
  background: none;
  border: none;
  color: var(--fg);
  cursor: pointer;
}

.btn-play-pause {
  width: 64px;
  height: 64px;
}
</style>
</head>
<body>

<div class="view-container" id="main-view">
  <div class="view-header col-left">
    <h1>LAB-0</h1>
  </div>

  <section id="section-home" class="section active">
    <canvas id="dot-matrix-canvas"></canvas>
  </section>

  <section id="section-playlist" class="section col-right">
    <div class="project-list">
      <div class="project-item" onclick="openPlayer('LEVEL_01', 'STACK IT, GO UP', 'CONCERT', 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">
        <span class="project-id">01</span>
        <span class="project-name">LEVEL_01</span>
        <span class="project-tag">CONCERT</span>
      </div>
      <div class="project-item" onclick="openPlayer('LEVEL_02', 'ATMOS', 'M/V', 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4')">
        <span class="project-id">02</span>
        <span class="project-name">LEVEL_02</span>
        <span class="project-tag">M/V</span>
      </div>
      <div class="project-item" onclick="openPlayer('LEVEL_03', 'PINEAPPLE SLICE', 'M/V', 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
        <span class="project-id">03</span>
        <span class="project-name">LEVEL_03</span>
        <span class="project-tag">M/V</span>
      </div>
    </div>
  </section>

  <section id="section-about" class="section col-right">
    <div class="profile-card">
      <div class="avatar-row">
        <img class="avatar" src="https://github.com/ephemeralgaze.png" alt="Avatar">
        <div class="profile-names">
          <span class="p-name">Kyungsoo</span>
          <span class="p-handle">Ephemeral Gaze</span>
        </div>
      </div>
      
      <div class="spec-list">
        <div class="spec-item">
          <span class="spec-label">Education</span>
          <span class="spec-value">Animation Production Technology</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">College</span>
          <span class="spec-value">Heilongjiang Vocational College of Art</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Age</span>
          <span class="spec-value">21</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Contact</span>
          <span class="spec-value">a3445886718@gmail.com</span>
        </div>
        <div class="spec-item">
          <span class="spec-label">Status</span>
          <span class="spec-value">LAB_ACTIVE</span>
        </div>
      </div>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <div class="nav-btn active" onclick="switchSection('home')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    <span class="nav-label">Home</span>
  </div>
  <div class="nav-btn" onclick="switchSection('playlist')">
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    <span class="nav-label">Playlist</span>
  </div>
  <div class="nav-btn" onclick="switchSection('about')">
    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
    <span class="nav-label">About</span>
  </div>
</nav>

<div id="player-modal" class="player-modal">
  <button class="close-player-btn" onclick="closePlayer()">CLOSE [X]</button>
  <div class="drag-bar-container" id="modal-drag" onclick="closePlayer()">
    <div class="drag-bar"></div>
  </div>
  <div class="player-content">
    <div class="video-container">
      <video id="player-video" playsinline loop muted>
        <source src="" type="video/mp4">
      </video>
    </div>
    <div class="player-info">
      <div id="p-title" class="player-title">--</div>
      <div id="p-subtitle" class="player-subtitle">--</div>
    </div>
    <div class="player-controls">
      <div class="scrubber-container">
        <input type="range" id="p-scrubber" class="scrubber" value="0" min="0" step="0.1">
        <div class="time-row"><span id="p-current">0:00</span><span id="p-duration">0:00</span></div>
      </div>
      <div class="transport-controls">
        <button id="p-play" class="control-btn btn-play-pause">
          <svg id="svg-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
          <svg id="svg-pause" style="display:none" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function switchSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  const btns = document.querySelectorAll('.nav-btn');
  if (id === 'home') btns[0].classList.add('active');
  else if (id === 'playlist') btns[1].classList.add('active');
  else if (id === 'about') btns[2].classList.add('active');
}

(function() {
  const canvas = document.getElementById("dot-matrix-canvas");
  const ctx = canvas.getContext("2d");
  let dots = [];
  let width, height, dpr;
  const GRID_SIZE = 30;
  const DOT_RADIUS = 1.2;

  function init() {
    dpr = window.devicePixelRatio || 1;
    width = canvas.parentElement.clientWidth;
    height = canvas.parentElement.clientHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    ctx.scale(dpr, dpr);
    dots = [];
    const cols = Math.ceil(width / GRID_SIZE), rows = Math.ceil(height / GRID_SIZE);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        dots.push({ x: i * GRID_SIZE + GRID_SIZE / 2, y: j * GRID_SIZE + GRID_SIZE / 2, phase: Math.random() * Math.PI * 2, freq: 0.02 + Math.random() * 0.03, maxOpacity: 0.02 + Math.random() * 0.28 });
      }
    }
  }

  function draw(time) {
    if (document.getElementById('section-home').classList.contains('active')) {
      ctx.clearRect(0, 0, width, height);
      dots.forEach(dot => {
        const opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
        ctx.beginPath(); ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2); ctx.fillStyle = "rgba(255, 255, 255, " + opacity.toFixed(3) + ")"; ctx.fill();
      });
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", init); init(); requestAnimationFrame(draw);
})();

const playerModal = document.getElementById('player-modal');
const mainView = document.getElementById('main-view');
const playerVideo = document.getElementById('player-video');
const scrubber = document.getElementById('p-scrubber');

function openPlayer(title, subtitle, tag, url) {
  document.getElementById('p-title').innerText = title;
  document.getElementById('p-subtitle').innerText = subtitle;
  playerVideo.src = url;
  playerModal.classList.add('open');
  mainView.classList.add('modal-open');
  playerVideo.play();
}

function closePlayer() {
  playerModal.classList.remove('open');
  mainView.classList.remove('modal-open');
  playerVideo.pause();
  playerVideo.src = "";
  playerModal.style.transform = '';
}

document.getElementById('p-play').addEventListener('click', () => {
  if (playerVideo.paused) { playerVideo.play(); document.getElementById('svg-play').style.display = 'none'; document.getElementById('svg-pause').style.display = 'block'; }
  else { playerVideo.pause(); document.getElementById('svg-play').style.display = 'block'; document.getElementById('svg-pause').style.display = 'none'; }
});

playerVideo.addEventListener('timeupdate', () => {
  if (!scrubber.dragging) {
    scrubber.value = playerVideo.currentTime;
    document.getElementById('p-current').innerText = Math.floor(playerVideo.currentTime / 60) + ":" + String(Math.floor(playerVideo.currentTime % 60)).padStart(2, '0');
  }
});

playerVideo.addEventListener('loadedmetadata', () => {
  scrubber.max = playerVideo.duration;
  document.getElementById('p-duration').innerText = Math.floor(playerVideo.duration / 60) + ":" + String(Math.floor(playerVideo.duration % 60)).padStart(2, '0');
});

scrubber.addEventListener('input', () => { scrubber.dragging = true; playerVideo.currentTime = scrubber.value; });
scrubber.addEventListener('change', () => { scrubber.dragging = false; });

let startY = 0, currentY = 0;
const dragBar = document.getElementById('modal-drag');
dragBar.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; });
dragBar.addEventListener('touchmove', (e) => {
  currentY = e.touches[0].clientY;
  const diff = currentY - startY;
  if (diff > 0) { playerModal.style.transform = `translateY(${diff}px)`; playerModal.style.transition = 'none'; }
});
dragBar.addEventListener('touchend', () => {
  const diff = currentY - startY;
  playerModal.style.transition = 'transform 0.6s var(--player-ease)';
  if (diff > 150) closePlayer();
  else playerModal.style.transform = 'translateY(0)';
  startY = 0; currentY = 0;
});
</script>
</body>
</html>
