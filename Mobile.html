<style>
:root {
  --bg-color: #050505;
  --overlay-bg: #050505;
  --white: #ffffff;
  --grid-color: #ffffff;
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
  --font-mono: "Space Mono", monospace;
  --ease: cubic-bezier(0.8, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Global 0px border-radius doctrine for layout elements */
div, section, article, nav, header, footer, a, span, button, input {
  border-radius: 0 !important;
}

/* Restored: SVGs, App Icons, and Avatars can have their inherent shapes or slight rounding if required for visual clarity, 
   but we'll keep avatars square per 0px doctrine unless explicitly requested otherwise. 
   The user specifically complained about "mobile icons" being squares. */
svg, svg * {
  border-radius: inherit !important;
}

body, html {
  width: 100%;
  height: 100%;
  background-color: var(--bg-color);
  color: var(--white);
  overflow: hidden;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#dot-matrix-canvas {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

#bg-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  z-index: 1;
  pointer-events: none;
}

.ui-grid {
  position: fixed;
  inset: 10px;
  border: 1px solid var(--grid-color);
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease-out;
  z-index: 5;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  pointer-events: none;
}

#wordmark {
  position: absolute;
  top: 50%;
  left: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-header);
  font-weight: 700;
  font-size: 1.1rem;
  height: 20px;
  line-height: 20px;
  white-space: nowrap;
  letter-spacing: 0;
  transform: translate(-50%, -50%) scale(3.3);
  transition: transform 1.2s var(--ease), top 1.2s var(--ease), left 1.2s var(--ease), opacity 0.8s ease;
  opacity: 1;
}

#wordmark.docked {
  top: 30px;
  left: 25px;
  transform: translate(0, -50%) scale(0.8);
  pointer-events: auto;
}

.l-char { display: flex; align-items: center; height: 20px; }

.ab0-reveal {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  opacity: 0;
  visibility: hidden;
  transition: clip-path 1.2s var(--ease), opacity 0.6s var(--ease), visibility 0.4s var(--ease);
}

#wordmark.docked-final .ab0-reveal {
  opacity: 1;
  visibility: visible;
  clip-path: inset(0 0 0 0);
}

.mobile-icon {
  width: 1em;
  height: 1em;
  margin-left: 2px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

/* Fix for icons: ensure SVGs can have rounded corners inside them */
.mobile-icon rect {
  rx: 2;
  ry: 2;
}

#mobile-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: #050505;
  z-index: 10002;
  opacity: 0;
  visibility: hidden;
}

#mobile-header.active { opacity: 1; visibility: visible; }

.hamburger {
  position: fixed;
  top: 0;
  right: 25px;
  width: 20px;
  height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  z-index: 10003;
  opacity: 0;
  pointer-events: none;
}

.hamburger-inner {
  width: 100%;
  height: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hamburger span {
  display: block;
  width: 100%;
  height: 1px;
  background-color: var(--white);
}

.mobile-nav-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-color);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 30px;
  transform: translateX(100%);
  transition: transform 0.6s var(--ease);
}

.mobile-nav-overlay.open { transform: translateX(0); }

.mobile-menu-item {
  font-family: var(--font-header);
  font-size: 1rem;
  letter-spacing: 0.2em;
  color: var(--white);
  text-decoration: none;
  text-transform: uppercase;
  opacity: 0.6;
}

.mobile-menu-item.active { opacity: 1; }

.overlay {
  position: fixed;
  inset: 0;
  background: #050505;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.8s var(--ease);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-y: auto;
}

.overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

.overlay-frame {
  position: absolute;
  inset: 10px;
  border: 1px solid #ffffff;
  pointer-events: none;
}

.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 8px;
  color: #ffffff;
  letter-spacing: 0.1em;
}

.coord-tl { top: -15px; left: 0; }
.coord-br { bottom: -15px; right: 0; }

.content-grid {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 80px 20px 40px;
}

.col-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  width: 100%;
  margin-bottom: 30px;
}

.avatar {
  width: 90px;
  height: 90px;
  border: 1px solid #ffffff;
  background: #000;
  overflow: hidden;
}

/* RESTORED: Avatars should be square per doctrine, but icons inside SVGs should be correct. */
.avatar img { width: 100%; height: 100%; object-fit: cover; }

.username {
  font-family: var(--font-header);
  font-size: 0.9rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.col-right {

.info-item {

.info-item:first-child { border-top: 1px solid rgba(255, 255, 255, 0.2); }

.info-label {

.info-value {

.mail-link {

  word-break: break-all;

#projects-overlay:not(.has-content) .overlay-frame {

}
#projects-overlay:not(.has-content) .coord {
  display: none;

.ui-visible { opacity: 1 !important; pointer-events: auto !important; }
</style>

<script>
(function() {
  var canvas = document.getElementById("dot-matrix-canvas");
  var ctx = canvas.getContext("2d");
  var dots = [];
  var width, height, dpr;
  function init() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    dots = [];
    for (var i = 0; i < width/30; i++) {
      for (var j = 0; j < height/30; j++) {
        dots.push({x: i*30+15, y: j*30+15, phase: Math.random()*Math.PI*2, freq: 0.02+Math.random()*0.03, maxOpacity: 0.05+Math.random()*0.15});
      }
    }
  }
  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    dots.forEach(function(dot) {
      var opacity = (Math.sin(time*0.001*dot.freq*100+dot.phase)*0.5+0.5)*dot.maxOpacity;
      ctx.beginPath(); ctx.arc(dot.x, dot.y, 1, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,"+opacity.toFixed(3)+")"; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", init); init(); requestAnimationFrame(draw);
})();

document.addEventListener("DOMContentLoaded", function() {
  var wordmark = document.getElementById("wordmark");
  var grid = document.getElementById("grid");
  var hamburger = document.getElementById("hamburger");
  var mobileNav = document.getElementById("mobile-nav");
  var mobileHeader = document.getElementById("mobile-header");
  var aboutOverlay = document.getElementById("about-overlay");
  var projectsOverlay = document.getElementById("projects-overlay");

  setTimeout(function() { wordmark.classList.add("docked"); }, 1500);
  wordmark.addEventListener("transitionend", function() {
    if (wordmark.classList.contains("docked")) {
      grid.classList.add("ui-visible");
      hamburger.classList.add("ui-visible");
      wordmark.classList.add("docked-final");
    }
  });

  function switchPage(page) {
    [aboutOverlay, projectsOverlay, mobileHeader, mobileNav].forEach(el => el.classList.remove("active", "open"));
    hamburger.classList.remove("open");
    if (page === "about") { aboutOverlay.classList.add("active"); mobileHeader.classList.add("active"); }
    else if (page === "projects") { projectsOverlay.classList.add("active"); mobileHeader.classList.add("active"); }
  }

  hamburger.onclick = function() { hamburger.classList.toggle("open"); mobileNav.classList.toggle("open"); };
  document.getElementById("nav-home").onclick = function() { switchPage("home"); };
  document.getElementById("m-nav-home").onclick = function() { switchPage("home"); };
  document.getElementById("m-about-trigger").onclick = function() { switchPage("about"); };
  document.getElementById("m-projects-trigger").onclick = function() { switchPage("projects"); };
});
</script>
