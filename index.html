<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB-0 | COMMAND CENTER</title>
<style>
html, body {
background: #050505;
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
}
</style>
<script>
(function() {
  function redirect() {
    var width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    var isMobile = width < 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isMobile) {
      window.location.replace("Mobile.html");
    } else {
      window.location.replace("Desktop.html");
    }
  }
  redirect();
  window.addEventListener('resize', redirect);
})();
</script>
</head>
<body style="background:#050505;">
</body>
</html>
