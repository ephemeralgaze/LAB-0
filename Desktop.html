<!-- ============ 网络友好的字体加载 ============ -->
<!-- Google Fonts 异步加载，允许超时失败 -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" onerror="console.warn('Google Fonts 加载失败，使用系统字体')">

<!-- 字体加载失败的备用策略 -->
<script>
// 监测 Google Fonts 加载状态
window.fontsLoaded = false;
window.addEventListener('load', function() {
  window.fontsLoaded = true;
  document.documentElement.classList.add('fonts-ready');
});

// 设置字体加载超时降级（5秒后还没加载就放弃）
setTimeout(function() {
  if (!window.fontsLoaded && !document.documentElement.classList.contains('fonts-ready')) {
    document.documentElement.classList.add('fonts-fallback');
    console.log('⏱️ 字体加载超时，使用系统字体');
  }
}, 5000);
</script>

<!-- ============ 移动设备检测 ============ -->
<script>
(function() {
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile || window.innerWidth < 768) {
    window.location.replace("Mobile.html");
  }
})();

// ============ 网络状态管理 ============
window.networkStatus = {
  isOnline: navigator.onLine,
  offlineIndicator: null,
  init: function() {
    var self = this;
    window.addEventListener('online', function() {
      self.isOnline = true;
      console.log('🟢 网络: 在线');
      if (self.offlineIndicator) self.offlineIndicator.classList.remove('visible');
    });
    window.addEventListener('offline', function() {
      self.isOnline = false;
      console.log('🔴 网络: 离线 - 使用本地备用资源');
      if (self.offlineIndicator) self.offlineIndicator.classList.add('visible');
    });
  }
};
</script>

<style>
:root {
  --bg-color: #050505;
  --overlay-bg: rgba(5, 5, 5, 0.7);
  --white: #ffffff;
  --grid-color: #ffffff;
  
  /* 优先使用 Google Fonts，失败则自动降级到系统字体 */
  --font-header: "Syncopate", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

/* 网络良好时使用高级特性 */
@supports (backdrop-filter: blur(1px)) {
  .overlay { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
}

/* 字体加载失败时的降级方案 */
html.fonts-fallback {

/* 高色域显示支持 */

* {

body, html {

#dot-matrix-canvas {

#bg-overlay {

@supports (backdrop-filter: blur(1px)) {

.ui-grid {
  position: fixed;

  opacity: 0;

.stage {

  inset: 0;

#wordmark {

  transition: transform 1.2s var(--ease), opacity 0.8s ease;
  will-change: transform;
  opacity: 1;
}

.ab0-reveal {

  align-items: center;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1.2s var(--ease), opacity 0.6s var(--ease);
  will-change: clip-path;
  opacity: 0;
}

#wordmark.assembled .ab0-reveal {
  opacity: 1;
  clip-path: inset(0 0 0 0) !important;
}

#wordmark.docked {
  transform: translate(calc(-50vw + 60px + 1.9em), calc(-50vh + 45px + 0.4em)) scale(1);
  pointer-events: auto;
}

.desktop-icon {
  width: 1.1em;
  height: 1.1em;
  margin-left: 0.15em;
  flex-shrink: 0;

  stroke-width: 2.5;
  fill: none;
  display: inline-block;
}

.menu-items {

  top: 50%;
  transform: translateY(-50%);

  align-items: center;

.ui-visible { opacity: 1 !important; }

.overlay {

<script>
// ============ 网络管理器初始化 ============
window.networkStatus.offlineIndicator = document.getElementById('network-indicator');
window.networkStatus.init();

// ============ 点阵背景动画（不依赖网络） ============
(function() {
  var canvas = document.getElementById("dot-matrix-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dots = [];
  var width, height, dpr;

  var GRID_SIZE = 30;
  var DOT_RADIUS = 1.2;

  function init() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    
    dots = [];
    var cols = Math.ceil(width / GRID_SIZE);
    var rows = Math.ceil(height / GRID_SIZE);

    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        dots.push({
          x: i * GRID_SIZE + GRID_SIZE / 2,
          y: j * GRID_SIZE + GRID_SIZE / 2,
          phase: Math.random() * Math.PI * 2,
          freq: 0.02 + Math.random() * 0.03,
          maxOpacity: 0.10 + Math.random() * 0.40
        });
      }
    }
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    
    dots.forEach(function(dot) {
      var opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, " + (opacity + 0.05).toFixed(3) + ")";
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", init);
  init();
  requestAnimationFrame(draw);
})();

// ============ 主业务逻辑 ============
document.addEventListener("DOMContentLoaded", function() {
  var wordmark = document.getElementById("wordmark");
  var grid = document.getElementById("grid");
  var menu = document.getElementById("menu");
  var projectsTrigger = document.getElementById("projects-trigger");
  var aboutTrigger = document.getElementById("about-trigger");
  var navHome = document.getElementById("nav-home");
  var projectsOverlay = document.getElementById("projects-overlay");
  var aboutOverlay = document.getElementById("about-overlay");

  // 动画序列
  setTimeout(function() { if (wordmark) wordmark.classList.add("assembled"); }, 1500);
  setTimeout(function() { if (wordmark) wordmark.classList.add("docked"); }, 3500);
  setTimeout(function() { if (grid) grid.classList.add("ui-visible"); if (menu) menu.classList.add("visible"); }, 4700);

  // 导航事件
  if (projectsTrigger) projectsTrigger.addEventListener("click", function() {
    aboutOverlay.classList.remove("active");
    projectsOverlay.classList.add("active");
  });

  if (aboutTrigger) {
    aboutTrigger.addEventListener("click", function() {
      projectsOverlay.classList.remove("active");
      aboutOverlay.classList.add("active");
    });
  }

  if (navHome) {
    navHome.addEventListener("click", function() { 
      projectsOverlay.classList.remove("active"); 
      aboutOverlay.classList.remove("active"); 
    });
  }
});
</script>
