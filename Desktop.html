<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 // DESKTOP COMMAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --overlay-bg: #050505;
            --fg: #FFFFFF;
            --muted: #666666;
            --border: 1px solid #FFFFFF;
            --border-dim: 1px solid rgba(255, 255, 255, 0.1);
            --font-header: 'Syncopate', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-smooth: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 80px 1fr;
        }

        #dot-matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            opacity: 0.85;
            z-index: 2;
            pointer-events: none;
        }

        #boot-screen-bg {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            transition: opacity 1.2s var(--transition-smooth);
            pointer-events: none;
        }

        #logo-main {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 64px;
            letter-spacing: 0px;
            text-transform: uppercase;
            z-index: 2100;
            white-space: nowrap;
            transition: transform var(--transition-smooth), font-size var(--transition-smooth), letter-spacing var(--transition-smooth);
            will-change: transform, font-size;
        }

        #boot-lab { 
            display: inline-block;
            margin-right: -0.1em;
        }
        
        #boot-variant { 
            display: inline-block;
            min-width: 0.8em;
            text-align: left;
        }

        header {
            grid-column: 1 / -1;
            padding: 0 40px;
            display: flex;
            align-items: center;
            border-bottom: var(--border-dim);
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #logo-placeholder {
            font-family: var(--font-header);
            font-size: 16px;
            letter-spacing: 6px;
            font-weight: 700;
            visibility: hidden;
        }

        .sidebar {
            padding: 40px;
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            overflow-y: auto;
        }

        .sidebar-left {
            border-right: var(--border-dim);
            display: flex;
            flex-direction: column;
            gap: 15px; 
            overflow: visible;
        }

        .category-header, .about-link {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--fg);
            padding: 8px 0;
            transition: color 0.3s ease;
            position: relative;
            z-index: 20;
            text-decoration: none;
        }

        .category-header:hover, .about-link:hover, .about-link.active {
            color: var(--muted);
        }

        .arrow-icon {
            width: 10px;
            height: 10px;
            transition: transform var(--transition-smooth);
            fill: currentColor;
        }

        .category-header.expanded .arrow-icon {
            transform: rotate(90deg);
        }

        .project-list-wrapper {
            position: relative;
            padding-left: 22px;
            display: grid;
            grid-template-rows: 0fr; 
            transition: grid-template-rows var(--transition-smooth);
            overflow: visible;
        }

        .category-header.expanded ~ .project-list-wrapper {
            grid-template-rows: 1fr; 
        }

        .project-list {
            min-height: 0; 
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .project-item {
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 6px 0;
            cursor: pointer;
            color: var(--muted);
            transition: 
                transform var(--transition-smooth), 
                opacity var(--transition-smooth), 
                color var(--transition-smooth),
                font-size var(--transition-smooth),
                letter-spacing var(--transition-smooth),
                padding var(--transition-smooth);
            text-transform: uppercase;
            white-space: nowrap;
            transform-origin: left center;
        }

        .project-item.active {
            color: var(--fg);
            font-weight: 700;
        }

        .category-header:not(.expanded) ~ .project-list-wrapper .project-item:not(.active) {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }

        .category-header:not(.expanded) ~ .project-list-wrapper .project-item.active {
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--muted);
            padding: 0;
            transform: translateY(-30px);
        }

        .category-header:not(.expanded).has-selection ~ .project-list-wrapper {
            grid-template-rows: 20px; 
        }

        .category-header.expanded ~ .project-list-wrapper .project-item {
            opacity: 1;
            transform: translateY(0) translateX(0);
            pointer-events: auto;
        }

        .main-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            z-index: 10;
        }

        #video-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #050505;
            box-shadow: 0 0 0 1px #ffffff;
            position: relative;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #main-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-right {
            border-left: var(--border-dim);
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* --- About Section Styles --- */
        #about-content {
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            flex-direction: column;
            gap: 40px;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border: var(--border);
            object-fit: cover;
        }

        .profile-identity {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .p-name {
            font-family: var(--font-header);
            font-size: 20px;
            letter-spacing: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .p-handle {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .spec-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-label {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spec-value {
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--fg);
            letter-spacing: 1px;
        }

        #close-trigger {
            position: absolute;
            top: -30px;
            right: 0;
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
        }

        #close-trigger.active {
            opacity: 0.6;
            pointer-events: auto;
        }

        .visible { opacity: 1 !important; }
    </style>
</head>
<body>

    <canvas id="dot-matrix-canvas"></canvas>
    <div id="bg-overlay"></div>
    <div id="boot-screen-bg"></div>

    <div class="boot-logo-container" id="logo-main">
        <span id="boot-lab">LAB-</span>
        <div id="boot-variant"><span id="char-target">0</span></div>
    </div>

    <header id="hud-header">
        <h1 id="logo-placeholder">LAB-0</h1>
    </header>

    <aside class="sidebar sidebar-left" id="hud-left">
        <div id="projects-section">
            <div id="projects-header" class="category-header" onclick="toggleCategory(this)">
                <svg class="arrow-icon" viewBox="0 0 10 10">
                    <path d="M2 1 L8 5 L2 9 Z" />
                </svg>
                <span>Projects</span>
            </div>
            <div class="project-list-wrapper">
                <ul class="project-list">
                    <li class="project-item" data-id="1" onclick="selectProject(1)">[01] LEVEL_01</li>
                    <li class="project-item" data-id="2" onclick="selectProject(2)">[02] LEVEL_02</li>
                    <li class="project-item" data-id="3" onclick="selectProject(3)">[03] LEVEL_03</li>
                </ul>
            </div>
        </div>
        <a href="#" id="about-btn" class="about-link" onclick="handleAboutClick(event)">
            <svg style="width:10px; height:10px; visibility:hidden;"></svg> 
            <span>About</span>
        </a>
    </aside>

    <main class="main-stage" id="hud-center">
        <div id="video-container">
            <button id="close-trigger" onclick="closeProject()">CLOSE [X]</button>
            <video id="main-video" playsinline crossorigin="anonymous">
                <source id="video-src" src="" type="video/mp4">
            </video>
        </div>
    </main>

    <aside class="sidebar sidebar-right" id="hud-right">
        <div id="about-content">
            <div class="profile-header">
                <img class="avatar" src="https://github.com/ephemeralgaze.png" alt="Avatar">
                <div class="profile-identity">
                    <span class="p-name">Kyungsoo</span>
                    <span class="p-handle">Ephemeral Gaze</span>
                </div>
            </div>
            
            <div class="spec-grid">
                <div class="spec-item"><span class="spec-label">Education</span><span class="spec-value">Animation Production Technology</span></div>
                <div class="spec-item"><span class="spec-label">College</span><span class="spec-value">Heilongjiang Vocational College of Art</span></div>
                <div class="spec-item"><span class="spec-label">Age</span><span class="spec-value">21</span></div>
                <div class="spec-item"><span class="spec-label">Contact</span><span class="spec-value">a3445886718@gmail.com</span></div>
                <div class="spec-item"><span class="spec-label">Identity</span><span class="spec-value">GITHUB // EPHEMERALGAZE</span></div>
                <div class="spec-item"><span class="spec-label">Status</span><span class="spec-value">LAB_ACTIVE // STABLE</span></div>
            </div>
        </div>
    </aside>

    <script>
        const projects = {
            1: { title: "LEVEL_01 // NIAGARA", desc: "INITIAL PARTICLE COLLISION TESTS...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            2: { title: "LEVEL_02 // GRAVITY", desc: "STRESS TESTING POINT-GRAVITY NODES...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            3: { title: "LEVEL_03 // WIND", desc: "INTEGRATION OF DIRECTIONAL WIND FIELDS...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
        };

        const canvas = document.getElementById('dot-matrix-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        const GRID_SIZE = 40;
        const DOT_RADIUS = 1;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            const cols = Math.ceil(canvas.width / GRID_SIZE), rows = Math.ceil(canvas.height / GRID_SIZE);
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    dots.push({ x: i * GRID_SIZE, y: j * GRID_SIZE, phase: Math.random() * Math.PI * 2, freq: 0.02 + Math.random() * 0.03, maxOpacity: 0.05 + Math.random() * 0.25 });
                }
            }
        }

        function animate(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(dot => {
                const opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
                ctx.beginPath(); ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        function toggleCategory(header) {
            // If opening projects, hide About
            if (!header.classList.contains('expanded')) {
                hideAbout();
            }
            header.classList.toggle('expanded');
        }

        function handleAboutClick(e) {
            e.preventDefault();
            const header = document.getElementById('projects-header');
            const aboutBtn = document.getElementById('about-btn');
            
            if (aboutBtn.classList.contains('active')) {
                hideAbout();
            } else {
                // Collapse projects if open
                if (header.classList.contains('expanded')) {
                    header.classList.remove('expanded');
                }
                closeProject();
                showAbout();
            }
        }

        function showAbout() {
            const content = document.getElementById('about-content');
            const btn = document.getElementById('about-btn');
            btn.classList.add('active');
            content.style.display = 'flex';
            setTimeout(() => { content.style.opacity = '1'; }, 50);
        }

        function hideAbout() {
            const content = document.getElementById('about-content');
            const btn = document.getElementById('about-btn');
            btn.classList.remove('active');
            content.style.opacity = '0';
            setTimeout(() => { content.style.display = 'none'; }, 800);
        }

        function scrambleText(element, finalString, duration, callback) {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$';
            const originalText = element.innerText;
            const start = performance.now();
            function update(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                let current = '';
                const finalLength = finalString.length;
                const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
                for (let i = 0; i < currentLength; i++) {
                    if (Math.random() < progress) current += finalString[i] || '';
                    else current += chars[Math.floor(Math.random() * chars.length)];
                }
                element.innerText = current;
                if (progress < 1) requestAnimationFrame(update);
                else { element.innerText = finalString; if (callback) callback(); }
            }
            requestAnimationFrame(update);
        }

        async function runBootSequence() {
            const bg = document.getElementById('boot-screen-bg');
            const logo = document.getElementById('logo-main');
            const targetChar = document.getElementById('char-target');
            const anchor = document.getElementById('logo-placeholder');
            const bootText = 'DESKTOP';

            await sleep(600);
            scrambleText(targetChar, bootText, 800);
            await sleep(1800);

            const rect = anchor.getBoundingClientRect();
            const targetX = rect.left + (rect.width / 2);
            const targetY = rect.top + (rect.height / 2);
            const deltaX = targetX - (window.innerWidth / 2);
            const deltaY = targetY - (window.innerHeight / 2);

            scrambleText(targetChar, '0', 1000);
            logo.style.letterSpacing = '6px';
            logo.style.fontSize = '16px';
            logo.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            await sleep(1000);
            bg.style.opacity = '0';
            document.getElementById('hud-header').classList.add('visible');
            document.getElementById('hud-left').classList.add('visible');
            document.getElementById('hud-center').classList.add('visible');
            document.getElementById('hud-right').classList.add('visible');

            await sleep(1200);
            bg.style.display = 'none';
        }

        function selectProject(id) {
            hideAbout();
            const items = document.querySelectorAll('.project-item');
            const container = document.getElementById('video-container');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            const header = document.getElementById('projects-header');

            items.forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.getAttribute('data-id')) === id) item.classList.add('active');
            });

            header.classList.add('has-selection');
            source.src = projects[id].video;
            container.style.display = 'flex';
            
            setTimeout(() => { container.style.opacity = '1'; document.getElementById('close-trigger').classList.add('active'); }, 50);
            video.load(); video.play();
        }

        function closeProject() {
            const container = document.getElementById('video-container');
            const video = document.getElementById('main-video');
            const header = document.getElementById('projects-header');
            const closeBtn = document.getElementById('close-trigger');

            container.style.opacity = '0';
            closeBtn.classList.remove('active');
            document.querySelectorAll('.project-item').forEach(i => i.classList.remove('active'));
            header.classList.remove('has-selection');
            video.pause();

            setTimeout(() => { container.style.display = 'none'; }, 800);
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        window.onload = () => {
            init();
            requestAnimationFrame(animate);
            runBootSequence();
        };

        window.onresize = () => { init(); };
    </script>
</body>
</html>
