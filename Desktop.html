<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 // DESKTOP COMMAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --fg: #FFFFFF;
            --muted: #666666;
            --border: 1px solid #FFFFFF;
            --font-header: 'Syncopate', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-smooth: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 80px 1fr;
        }

        /* --- Background Particles --- */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.3);
            z-index: 1;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* --- Boot Sequence --- */
        #boot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .boot-logo-container {
            position: relative;
            display: flex;
            align-items: center;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 64px;
            letter-spacing: 12px;
            text-transform: uppercase;
            transition: transform var(--transition-smooth), letter-spacing var(--transition-smooth);
            transform-origin: center center;
            white-space: nowrap;
            z-index: 2100;
        }

        #boot-lab { 
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #boot-variant { 
            position: relative; 
            display: inline-block;
            min-width: 40px;
            text-align: left;
        }
        
        .variant-char {
            display: inline-block;
        }

        /* --- Layout HUD --- */
        header {
            grid-column: 1 / -1;
            padding: 0 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        header h1 {
            font-family: var(--font-header);
            font-size: 16px;
            letter-spacing: 6px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar {
            padding: 40px;
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        /* --- Left Sidebar: Projects --- */
        .sidebar-left {
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .project-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .project-item {
            font-family: var(--font-mono);
            font-size: 14px;
            padding: 20px 0;
            cursor: pointer;
            color: var(--muted);
            transition: all var(--transition-smooth);
            position: relative;
            text-transform: uppercase;
        }

        .project-item.active {
            color: var(--fg);
            font-weight: 700;
            transform: scale(1.1);
            padding: 40px 0;
        }

        .project-item.shift-up { transform: translateY(-15px); }
        .project-item.shift-down { transform: translateY(15px); }

        /* --- Center Screen: Video --- */
        .main-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        /* --- Modified for Responsive Video Container --- */
        #video-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #050505;
            border: var(--border);
            position: relative;
            display: none;
            flex-direction: column;
            overflow: visible;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #main-video {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: cover;
        }

        .custom-controls {
            height: 40px;
            border-top: var(--border);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
            background: #000;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: left;
        }

        .seekbar-container {
            flex: 1;
            height: 1px;
            background: #333;
            position: relative;
            cursor: pointer;
        }

        #seekbar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #FFF;
            width: 0%;
        }

        .v-time {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--muted);
            min-width: 45px;
        }

        /* --- Right Sidebar: Details --- */
        .sidebar-right {
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        #project-title {
            font-family: var(--font-header);
            font-size: 24px;
            letter-spacing: 2px;
            line-height: 1.2;
            text-transform: uppercase;
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #project-desc {
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.8;
            color: var(--muted);
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        /* --- Close Button --- */
        #close-trigger {
            position: absolute;
            top: -30px;
            right: 0;
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #close-trigger.active {
            opacity: 0.6;
            pointer-events: auto;
        }
        #close-trigger:hover {
            opacity: 1;
        }

        /* --- Utilities --- */
        .visible { opacity: 1 !important; }

    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div id="bg-overlay"></div>

    <div id="boot-overlay">
        <div class="boot-logo-container">
            <span id="boot-lab">LAB-</span>
            <div id="boot-variant">
                <span id="char-target" class="variant-char">0</span>
            </div>
        </div>
    </div>

    <header id="hud-header">
        <h1 id="permanent-logo">LAB-0</h1>
    </header>

    <aside class="sidebar sidebar-left" id="hud-left">
        <ul class="project-list" id="project-list">
            <li class="project-item" data-id="1" onclick="selectProject(1)">[01] LEVEL_01</li>
            <li class="project-item" data-id="2" onclick="selectProject(2)">[02] LEVEL_02</li>
            <li class="project-item" data-id="3" onclick="selectProject(3)">[03] LEVEL_03</li>
        </ul>
    </aside>

    <main class="main-stage" id="hud-center">
        <div id="video-container">
            <button id="close-trigger" onclick="closeProject()">CLOSE [X]</button>
            <video id="main-video" playsinline crossorigin="anonymous">
                <source id="video-src" src="" type="video/mp4">
            </video>
            <div class="custom-controls">
                <button class="control-btn" id="play-pause" onclick="togglePlay()">[PLAY]</button>
                <span class="v-time" id="time-cur">00:00</span>
                <div class="seekbar-container" id="seekbar-root" onclick="seek(event)">
                    <div id="seekbar-fill"></div>
                </div>
                <span class="v-time" id="time-total">--:--</span>
                <button class="control-btn" onclick="toggleMute()" id="mute-toggle" style="text-align:right">MUTE</button>
            </div>
        </div>
    </main>

    <aside class="sidebar sidebar-right" id="hud-right">
        <h2 id="project-title">PROJECT_NAME</h2>
        <p id="project-desc">DESCRIPTION_TEXT</p>
    </aside>

    <script>
        // --- Configuration & Data ---
        const projects = {
            1: {
                title: "LEVEL_01 // NIAGARA",
                desc: "INITIAL PARTICLE COLLISION TESTS. EXPLORING REAL-TIME VECTOR FIELD MANIPULATION WITHIN THE UNREAL ENGINE NIAGARA SYSTEM. FOCUS ON FLUID DYNAMICS AND COLLISION STABILITY.",
                video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            },
            2: {
                title: "LEVEL_02 // GRAVITY",
                desc: "STRESS TESTING POINT-GRAVITY NODES. SIMULATING MASSIVE PARTICLE ATTRACTION AND RELEVANT LIGHTING CALCULATIONS ACROSS 1,000,000 INDIVIDUAL GPU-CALCULATED SPRITES.",
                video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
            },
            3: {
                title: "LEVEL_03 // WIND",
                desc: "INTEGRATION OF DIRECTIONAL WIND FIELDS WITH DYNAMIC TURBULENCE. ANALYSIS OF VOLUMETRIC NOISE IMPACT ON PARTICLE LIFESPAN AND COLOR-OVER-LIFE TRANSITIONS.",
                video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
            }
        };

        // --- Dot-Matrix Background ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        class Dot {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 1.2 + 0.5;
                this.baseOpacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = "rgba(255, 255, 255, " + this.baseOpacity + ")";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for (let i = 0; i < 180; i++) {
                dots.push(new Dot());
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(dot => {
                dot.update();
                dot.draw();
            });
            requestAnimationFrame(drawParticles);
        }

        // --- Glitch Utility ---
        function scrambleText(element, finalString, duration, callback) {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_@#$';
            const originalText = element.innerText;
            const start = performance.now();
            
            function update(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                
                let current = '';
                const finalLength = finalString.length;
                const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
                
                for (let i = 0; i < currentLength; i++) {
                    if (Math.random() < progress) {
                        current += finalString[i] || '';
                    } else {
                        current += chars[Math.floor(Math.random() * chars.length)];
                    }
                }
                
                element.innerText = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.innerText = finalString;
                    if (callback) callback();
                }
            }
            requestAnimationFrame(update);
        }

        // --- Boot Sequence Logic ---
        async function runBootSequence() {
            const overlay = document.getElementById('boot-overlay');
            const container = document.querySelector('.boot-logo-container');
            const lab = document.getElementById('boot-lab');
            const target = document.getElementById('char-target');
            const headerLogo = document.getElementById('permanent-logo');
            
            // 1. Detection
            const width = window.innerWidth;
            const isMobile = width <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const targetText = isMobile ? 'Mobile' : 'Desktop';

            // Start State
            await sleep(800);

            // 3. Recognition Anim
            lab.style.transform = 'translateX(-40px)';
            scrambleText(target, targetText, 800);
            
            await sleep(1800);

            // 4. One-Take Sliding-Scale Reversion
            const targetRect = headerLogo.getBoundingClientRect();
            const currentRect = container.getBoundingClientRect();

            // Transform origin: center so movement logic is simpler
            container.style.transformOrigin = "center center";
            
            // Calculate center points for delta
            const targetCenterX = targetRect.left + (targetRect.width * 0.5);
            const targetCenterY = targetRect.top + (targetRect.height * 0.5);
            const currentCenterX = currentRect.left + (currentRect.width * 0.5);
            const currentCenterY = currentRect.top + (currentRect.height * 0.5);

            const deltaX = targetCenterX - currentCenterX;
            const deltaY = targetCenterY - currentCenterY;

            // Start scramble back to 0 as we move
            scrambleText(target, '0', 1200);
            lab.style.transform = 'translateX(0px)';
            
            // Interpolate spacing: transition from compact to spaced-out look
            // Spacing in header is 6px, so we need 6 / 0.25 = 24px relative spacing
            container.style.letterSpacing = '24px';
            
            // Smoothly slide and scale
            container.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.25)`;

            await sleep(1300);
            
            // 5. Landing
            overlay.style.opacity = '0';
            headerLogo.style.opacity = '1';
            document.getElementById('hud-header').classList.add('visible');
            document.getElementById('hud-left').classList.add('visible');
            document.getElementById('hud-center').classList.add('visible');
            document.getElementById('hud-right').classList.add('visible');

            await sleep(800);
            overlay.style.display = 'none';
        }

        // --- Selection Logic ---
        function selectProject(id) {
            const items = document.querySelectorAll('.project-item');
            const container = document.getElementById('video-container');
            const title = document.getElementById('project-title');
            const desc = document.getElementById('project-desc');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            const closeBtn = document.getElementById('close-trigger');

            items.forEach((item, index) => {
                const itemId = parseInt(item.getAttribute('data-id'));
                item.classList.remove('active', 'shift-up', 'shift-down');
                if (itemId === id) { item.classList.add('active'); }
                else if (itemId < id) { item.classList.add('shift-up'); }
                else if (itemId > id) { item.classList.add('shift-down'); }
            });

            const data = projects[id];
            title.innerText = data.title;
            desc.innerText = data.desc;
            source.src = data.video;
            
            canvas.style.opacity = '0.1';
            container.style.display = 'flex';
            title.style.display = 'block';
            desc.style.display = 'block';
            
            setTimeout(() => {
                container.style.opacity = '1';
                title.style.opacity = '1';
                desc.style.opacity = '1';
                closeBtn.classList.add('active');
            }, 50);
            
            video.load();
            video.play();
            playBtn.innerText = '[PAUSE]';
        }

        function closeProject() {
            const items = document.querySelectorAll('.project-item');
            const container = document.getElementById('video-container');
            const title = document.getElementById('project-title');
            const desc = document.getElementById('project-desc');
            const video = document.getElementById('main-video');
            const closeBtn = document.getElementById('close-trigger');

            container.style.opacity = '0';
            title.style.opacity = '0';
            desc.style.opacity = '0';
            closeBtn.classList.remove('active');
            canvas.style.opacity = '1.0';

            items.forEach(item => { item.classList.remove('active', 'shift-up', 'shift-down'); });
            video.pause();

            setTimeout(() => {
                container.style.display = 'none';
                title.style.display = 'none';
                desc.style.display = 'none';
            }, 800);
        }

        // --- Video Player ---
        const video = document.getElementById('main-video');
        const playBtn = document.getElementById('play-pause');
        const muteBtn = document.getElementById('mute-toggle');
        const seekFill = document.getElementById('seekbar-fill');
        const timeCur = document.getElementById('time-cur');
        const timeTotal = document.getElementById('time-total');

        function togglePlay() {
            if (video.paused) { video.play(); playBtn.innerText = '[PAUSE]'; }
            else { video.pause(); playBtn.innerText = '[PLAY]'; }
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.innerText = video.muted ? 'UNMUTE' : 'MUTE';
        }

        video.addEventListener('timeupdate', () => {
            const pct = (video.currentTime / video.duration) * 100;
            seekFill.style.width = `${pct}%`;
            timeCur.innerText = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            timeTotal.innerText = formatTime(video.duration);
        });

        function seek(e) {
            const rect = document.getElementById('seekbar-root').getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            video.currentTime = pos * video.duration;
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        window.onload = () => {
            initParticles();
            drawParticles();
            runBootSequence();
        };

        window.onresize = initParticles;
    </script>
</body>
</html>
