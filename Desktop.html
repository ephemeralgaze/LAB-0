<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 // DESKTOP COMMAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --overlay-bg: #050505;
            --fg: #FFFFFF;
            --muted: #666666;
            --border: 1px solid #FFFFFF;
            --border-dim: 1px solid rgba(255, 255, 255, 0.08);
            --panel-bg: #0A0A0A;
            --row-hover: #1A1A1A;
            --row-active: #222222;
            --font-header: 'Syncopate', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-smooth: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            --ease-outliner: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 380px 1fr 380px;
            grid-template-rows: 80px 1fr;
        }

        #dot-matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            opacity: 0.85;
            z-index: 2;
            pointer-events: none;
        }

        #boot-screen-bg {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            transition: opacity 1.2s var(--transition-smooth);
            pointer-events: none;
        }

        #logo-main {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 84px;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            z-index: 2100;
            white-space: nowrap;
            transition: transform var(--transition-smooth), font-size var(--transition-smooth), letter-spacing var(--transition-smooth);
            will-change: transform, font-size;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #boot-lab { display: inline-block; margin-right: -0.05em; }
        #boot-variant { display: inline-block; min-width: 0.8em; text-align: left; }

        header {
            grid-column: 1 / -1;
            padding: 0 40px;
            display: flex;
            align-items: center;
            border-bottom: var(--border-dim);
            background: #000;
            z-index: 100;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #logo-placeholder {
            font-family: var(--font-header);
            font-size: 20px;
            letter-spacing: -0.02em;
            font-weight: 700;
            text-transform: uppercase;
            visibility: hidden;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- UE-Style Outliner Sidebar --- */
        .sidebar-left {
            background: var(--panel-bg);
            border-right: var(--border-dim);
            display: flex;
            flex-direction: column;
            z-index: 10;
            opacity: 0;
            transform: translateX(-40px); /* Initial state for entrance animation */
            transition: opacity var(--transition-smooth), transform var(--transition-smooth);
            overflow: hidden;
        }

        .sidebar-left.entrance {
            opacity: 1;
            transform: translateX(0);
        }

        .outliner-toolbar {
            height: 48px;
            border-bottom: var(--border-dim);
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #111;
        }

        .outliner-label {
            font-family: var(--font-mono);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #555;
        }

        .outliner-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .outliner-row {
            height: 42px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            cursor: pointer;
            gap: 12px;
            user-select: none;
            transition: background 0.15s ease;
        }

        .outliner-row:hover {
            background: var(--row-hover);
        }

        .outliner-row.active {
            background: var(--row-active);
            color: var(--fg);
        }

        .outliner-row.expanded .arrow-icon {
            transform: rotate(90deg);
        }

        .arrow-icon {
            width: 10px;
            height: 10px;
            fill: #444;
            transition: transform 0.3s var(--ease-outliner);
        }

        .row-icon {
            width: 16px;
            height: 16px;
            stroke: #666;
            stroke-width: 1.5;
            fill: none;
        }

        .row-text {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.8px;
            color: #ccc;
            text-transform: uppercase;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-type {
            font-size: 9px;
            color: #444;
            font-family: var(--font-mono);
        }

        .indent-1 { padding-left: 20px; }
        .indent-2 { padding-left: 44px; }

        .child-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.6s var(--ease-outliner);
            overflow: hidden;
        }

        .outliner-row.expanded + .child-wrapper {
            grid-template-rows: 1fr;
        }

        .child-content {
            min-height: 0;
        }

        /* --- Main Stage & Player --- */
        .main-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            z-index: 10;
        }

        #video-container {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid #FFFFFF; /* Mandatory White Border */
            position: relative;
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            flex-direction: column;
            overflow: hidden;
        }

        #main-video { flex: 1; width: 100%; height: 100%; object-fit: cover; }

        /* --- Player Controls --- */
        .player-controls {
            height: 60px;
            background: #050505;
            border-top: var(--border-dim);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }

        .p-btn {
            background: none;
            border: none;
            color: var(--fg);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 5px 10px;
            border: 1px solid transparent;
            transition: border 0.2s ease;
        }

        .p-btn:hover {
            border: 1px solid #333;
        }

        .scrubber-root {
            flex: 1;
            height: 2px;
            background: #222;
            position: relative;
            cursor: pointer;
        }

        #scrubber-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--fg);
        }

        .p-time {
            font-family: var(--font-mono);
            font-size: 10px;
            color: #666;
            min-width: 80px;
            text-align: center;
        }

        /* --- Right Sidebar --- */
        .sidebar-right {
            background: var(--panel-bg);
            border-left: var(--border-dim);
            padding: 50px;
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        #about-content {
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            flex-direction: column;
            gap: 40px;
        }

        .avatar { width: 140px; height: 140px; border: 1px solid #222; object-fit: cover; }
        .p-name { font-family: var(--font-header); font-size: 20px; letter-spacing: 3px; text-transform: uppercase; }
        .spec-grid { display: flex; flex-direction: column; gap: 24px; }
        .spec-item { display: flex; flex-direction: column; gap: 6px; }
        .spec-label { font-family: var(--font-mono); font-size: 9px; color: #444; text-transform: uppercase; letter-spacing: 2px; }
        .spec-value { font-family: var(--font-body); font-size: 15px; color: #999; }

        .visible { opacity: 1 !important; }
    </style>
</head>
<body>

    <canvas id="dot-matrix-canvas"></canvas>
    <div id="bg-overlay"></div>
    <div id="boot-screen-bg"></div>

    <div class="boot-logo-container" id="logo-main">
        <span id="boot-lab">LAB-</span>
        <div id="boot-variant"><span id="char-target">0</span></div>
    </div>

    <header id="hud-header">
        <h1 id="logo-placeholder">LAB-0</h1>
    </header>

    <aside class="sidebar-left" id="hud-left">
        <div class="outliner-toolbar">
            <span class="outliner-label">Outliner</span>
        </div>
        <div class="outliner-content">
            <div id="projects-header" class="outliner-row indent-1 expanded" onclick="toggleOutlinerNode(this)">
                <svg class="arrow-icon" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9 Z" /></svg>
                <svg class="row-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span class="row-text">World_Projects</span>
                <span class="row-type">Folder</span>
            </div>
            <div class="child-wrapper">
                <div class="child-content">
                    <div class="outliner-row indent-2 project-item" data-id="1" onclick="selectProject(1)">
                        <svg class="row-icon" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        <span class="row-text">LEVEL_01_NIAGARA</span>
                        <span class="row-type">Sequence</span>
                    </div>
                    <div class="outliner-row indent-2 project-item" data-id="2" onclick="selectProject(2)">
                        <svg class="row-icon" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        <span class="row-text">LEVEL_02_GRAVITY</span>
                        <span class="row-type">Sequence</span>
                    </div>
                    <div class="outliner-row indent-2 project-item" data-id="3" onclick="selectProject(3)">
                        <svg class="row-icon" viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        <span class="row-text">LEVEL_03_WIND</span>
                        <span class="row-type">Sequence</span>
                    </div>
                </div>
            </div>

            <div class="outliner-row indent-1" id="about-btn" onclick="handleAboutClick(event)">
                <svg class="arrow-icon" style="visibility:hidden" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9 Z" /></svg>
                <svg class="row-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span class="row-text">System_Profile</span>
                <span class="row-type">Actor</span>
            </div>
        </div>
    </aside>

    <main class="main-stage" id="hud-center">
        <div id="video-container">
            <video id="main-video" playsinline muted crossorigin="anonymous">
                <source id="video-src" src="" type="video/mp4">
            </video>
            <div class="player-controls">
                <button class="p-btn" id="play-pause" onclick="togglePlay()">[Play]</button>
                <div class="scrubber-root" id="seekbar-root" onclick="seek(event)">
                    <div id="scrubber-fill"></div>
                </div>
                <span class="p-time" id="time-display">00:00 / 00:00</span>
                <button class="p-btn" id="mute-toggle" onclick="toggleMute()">Unmute</button>
            </div>
        </div>
    </main>

    <aside class="sidebar-right" id="hud-right">
        <div id="about-content">
            <img class="avatar" src="https://github.com/ephemeralgaze.png" alt="Avatar">
            <div class="spec-grid">
                <div class="spec-item"><span class="spec-label">User</span><span class="spec-value">Kyungsoo</span></div>
                <div class="spec-item"><span class="spec-label">Identity</span><span class="spec-value">Ephemeral Gaze</span></div>
                <div class="spec-item"><span class="spec-label">Education</span><span class="spec-value">Animation Production</span></div>
                <div class="spec-item"><span class="spec-label">Status</span><span class="spec-value">STABLE // ACTIVE</span></div>
            </div>
        </div>
    </aside>

    <script>
        const projects = {
            1: { video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            2: { video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            3: { video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
        };

        const canvas = document.getElementById('dot-matrix-canvas');
        const ctx = canvas.getContext('2d');
        let dots = [];
        const GRID_SIZE = 40;
        const DOT_RADIUS = 1;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            dots = [];
            for (let i = 0; i < canvas.width / GRID_SIZE; i++) {
                for (let j = 0; j < canvas.height / GRID_SIZE; j++) {
                    dots.push({ x: i * GRID_SIZE, y: j * GRID_SIZE, phase: Math.random() * 6.28, freq: 0.02 + Math.random() * 0.03, maxOpacity: 0.05 + Math.random() * 0.2 });
                }
            }
        }

        function animate(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(dot => {
                const opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
                ctx.beginPath(); ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, 6.28); ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`; ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        function toggleOutlinerNode(header) {
            header.classList.toggle('expanded');
        }

        function handleAboutClick(e) {
            const btn = document.getElementById('about-btn');
            if (btn.classList.contains('active')) {
                hideAbout();
            } else {
                closeProject();
                showAbout();
            }
        }

        function showAbout() {
            const content = document.getElementById('about-content');
            const btn = document.getElementById('about-btn');
            btn.classList.add('active');
            content.style.display = 'flex';
            setTimeout(() => { content.style.opacity = '1'; }, 50);
        }

        function hideAbout() {
            const content = document.getElementById('about-content');
            const btn = document.getElementById('about-btn');
            btn.classList.remove('active');
            content.style.opacity = '0';
            setTimeout(() => { content.style.display = 'none'; }, 800);
        }

        function selectProject(id) {
            hideAbout();
            const rows = document.querySelectorAll('.project-item');
            rows.forEach(r => {
                r.classList.remove('active');
                if (parseInt(r.getAttribute('data-id')) === id) r.classList.add('active');
            });
            const container = document.getElementById('video-container');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            source.src = projects[id].video;
            container.style.display = 'flex';
            setTimeout(() => { container.style.opacity = '1'; }, 50);
            video.load();
            // Default to paused state per specifications
            video.pause();
            updateUIState();
        }

        function closeProject() {
            const container = document.getElementById('video-container');
            const video = document.getElementById('main-video');
            document.querySelectorAll('.project-item').forEach(r => r.classList.remove('active'));
            container.style.opacity = '0';
            video.pause();
            setTimeout(() => { container.style.display = 'none'; }, 800);
        }

        const video = document.getElementById('main-video');
        const playBtn = document.getElementById('play-pause');
        const timeDisplay = document.getElementById('time-display');
        const fill = document.getElementById('scrubber-fill');
        const muteBtn = document.getElementById('mute-toggle');

        function togglePlay() {
            if (video.paused) video.play();
            else video.pause();
            updateUIState();
        }

        function toggleMute() {
            video.muted = !video.muted;
            updateUIState();
        }

        function updateUIState() {
            playBtn.innerText = video.paused ? '[Play]' : '[Pause]';
            muteBtn.innerText = video.muted ? 'Unmute' : 'Mute';
        }

        video.addEventListener('timeupdate', () => {
            const pct = (video.currentTime / video.duration) * 100;
            fill.style.width = pct + '%';
            timeDisplay.innerText = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        });

        function seek(e) {
            const rect = document.getElementById('seekbar-root').getBoundingClientRect();
            video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        }

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function scrambleText(element, finalString, duration, callback) {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$';
            const originalText = element.innerText;
            const start = performance.now();
            function update(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                let current = '';
                const finalLength = finalString.length;
                const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
                for (let i = 0; i < currentLength; i++) {
                    if (Math.random() < progress) current += finalString[i] || '';
                    else current += chars[Math.floor(Math.random() * chars.length)];
                }
                element.innerText = current;
                if (progress < 1) requestAnimationFrame(update);
                else { element.innerText = finalString; if (callback) callback(); }
            }
            requestAnimationFrame(update);
        }

        async function runBootSequence() {
            const bg = document.getElementById('boot-screen-bg');
            const logo = document.getElementById('logo-main');
            const targetChar = document.getElementById('char-target');
            const anchor = document.getElementById('logo-placeholder');
            await sleep(600);
            scrambleText(targetChar, 'DESKTOP', 800);
            await sleep(1800);
            const rect = anchor.getBoundingClientRect();
            const targetX = rect.left + (rect.width / 2);
            const targetY = rect.top + (rect.height / 2);
            const deltaX = targetX - (window.innerWidth / 2);
            const deltaY = targetY - (window.innerHeight / 2);
            scrambleText(targetChar, '0', 1000);
            logo.style.letterSpacing = '-0.02em';
            logo.style.fontSize = '20px';
            logo.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;
            await sleep(1000);
            bg.style.opacity = '0';
            
            // Sequential Reveal: Header and Center first
            document.getElementById('hud-header').classList.add('visible');
            document.getElementById('hud-center').classList.add('visible');
            document.getElementById('hud-right').classList.add('visible');
            
            // Outliner entrance animation starts after logo settles
            setTimeout(() => {
                document.getElementById('hud-left').classList.add('entrance');
            }, 300);

            await sleep(1200);
            bg.style.display = 'none';
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        window.onload = () => { init(); requestAnimationFrame(animate); runBootSequence(); updateUIState(); };
        window.onresize = () => { init(); };
    </script>
</body>
</html>
