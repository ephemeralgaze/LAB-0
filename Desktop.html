<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 // DESKTOP COMMAND</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --overlay-bg: #050505;
            --fg: #FFFFFF;
            --muted: #666666;
            --border: 1px solid #FFFFFF;
            --font-header: 'Syncopate', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Space Grotesk', sans-serif;
            --transition-smooth: 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: var(--font-body);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 80px 1fr;
        }

        /* --- Z-Index / Layer Ordering --- */
        #dot-matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        #bg-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            opacity: 0.85;
            z-index: 2;
            pointer-events: none;
        }

        /* --- Boot Sequence --- */
        #boot-screen-bg {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            transition: opacity 1.2s var(--transition-smooth);
            pointer-events: none;
        }

        #logo-main {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-header);
            font-weight: 700;
            font-size: 64px;
            letter-spacing: 0px;
            text-transform: uppercase;
            z-index: 2100;
            white-space: nowrap;
            transition: transform var(--transition-smooth), font-size var(--transition-smooth), letter-spacing var(--transition-smooth);
            will-change: transform, font-size;
        }

        #boot-lab { 
            display: inline-block;
            margin-right: -0.1em;
        }
        
        #boot-variant { 
            display: inline-block;
            min-width: 0.8em;
            text-align: left;
        }

        /* --- HUD --- */
        header {
            grid-column: 1 / -1;
            padding: 0 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #logo-placeholder {
            font-family: var(--font-header);
            font-size: 16px;
            letter-spacing: 6px;
            font-weight: 700;
            visibility: hidden;
        }

        .sidebar {
            padding: 40px;
            z-index: 10;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        .sidebar-left {
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Accordion Projects Section --- */
        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            font-family: var(--font-mono);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--fg);
            padding: 10px 0;
            transition: color 0.3s ease;
        }

        .category-header:hover {
            color: var(--muted);
        }

        .arrow-icon {
            width: 10px;
            height: 10px;
            transition: transform var(--transition-smooth);
            fill: currentColor;
        }

        .category-header.expanded .arrow-icon {
            transform: rotate(90deg);
        }

        .project-list-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows var(--transition-smooth);
            overflow: hidden;
        }

        .category-header.expanded + .project-list-wrapper {
            grid-template-rows: 1fr;
        }

        .project-list {
            min-height: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            padding-left: 22px; /* Offset for alignment with "Projects" text */
        }

        .project-item {
            font-family: var(--font-mono);
            font-size: 12px;
            padding: 12px 0;
            cursor: pointer;
            color: var(--muted);
            transition: all var(--transition-smooth);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .project-item.active {
            color: var(--fg);
            font-weight: 700;
            transform: scale(1.05);
            padding: 20px 0;
        }

        .main-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            z-index: 10;
        }

        #video-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16/9;
            background: #050505;
            box-shadow: 0 0 0 1px #ffffff;
            position: relative;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #main-video {
            width: 100%;
            height: calc(100% - 40px);
            object-fit: cover;
        }

        .custom-controls {
            height: 40px;
            border-top: var(--border);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 20px;
            background: #000;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            min-width: 60px;
            text-align: left;
        }

        .seekbar-container {
            flex: 1;
            height: 1px;
            background: #333;
            position: relative;
            cursor: pointer;
        }

        #seekbar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #FFF;
            width: 0%;
        }

        .v-time {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--muted);
            min-width: 45px;
        }

        .sidebar-right {
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        #project-title {
            font-family: var(--font-header);
            font-size: 24px;
            letter-spacing: 2px;
            line-height: 1.2;
            text-transform: uppercase;
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #project-desc {
            font-family: var(--font-body);
            font-size: 12px;
            line-height: 1.8;
            color: var(--muted);
            display: none;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        #close-trigger {
            position: absolute;
            top: -30px;
            right: 0;
            background: transparent;
            border: none;
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity var(--transition-smooth);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #close-trigger.active {
            opacity: 0.6;
            pointer-events: auto;
        }

        .visible { opacity: 1 !important; }
    </style>
</head>
<body>

    <canvas id="dot-matrix-canvas"></canvas>
    <div id="bg-overlay"></div>
    <div id="boot-screen-bg"></div>

    <div class="boot-logo-container" id="logo-main">
        <span id="boot-lab">LAB-</span>
        <div id="boot-variant"><span id="char-target">0</span></div>
    </div>

    <header id="hud-header">
        <h1 id="logo-placeholder">LAB-0</h1>
    </header>

    <aside class="sidebar sidebar-left" id="hud-left">
        <div class="category-header expanded" onclick="toggleCategory(this)">
            <svg class="arrow-icon" viewBox="0 0 10 10">
                <path d="M2 1 L8 5 L2 9 Z" />
            </svg>
            <span>Projects</span>
        </div>
        <div class="project-list-wrapper">
            <ul class="project-list">
                <li class="project-item" data-id="1" onclick="selectProject(1)">[01] LEVEL_01</li>
                <li class="project-item" data-id="2" onclick="selectProject(2)">[02] LEVEL_02</li>
                <li class="project-item" data-id="3" onclick="selectProject(3)">[03] LEVEL_03</li>
            </ul>
        </div>
    </aside>

    <main class="main-stage" id="hud-center">
        <div id="video-container">
            <button id="close-trigger" onclick="closeProject()">CLOSE [X]</button>
            <video id="main-video" playsinline crossorigin="anonymous">
                <source id="video-src" src="" type="video/mp4">
            </video>
            <div class="custom-controls">
                <button class="control-btn" id="play-pause" onclick="togglePlay()">[PLAY]</button>
                <span class="v-time" id="time-cur">00:00</span>
                <div class="seekbar-container" id="seekbar-root" onclick="seek(event)">
                    <div id="seekbar-fill"></div>
                </div>
                <span class="v-time" id="time-total">--:--</span>
                <button class="control-btn" onclick="toggleMute()" id="mute-toggle" style="text-align:right">MUTE</button>
            </div>
        </div>
    </main>

    <aside class="sidebar sidebar-right" id="hud-right">
        <h2 id="project-title">PROJECT_NAME</h2>
        <p id="project-desc">DESCRIPTION_TEXT</p>
    </aside>

    <script>
        const projects = {
            1: { title: "LEVEL_01 // NIAGARA", desc: "INITIAL PARTICLE COLLISION TESTS...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            2: { title: "LEVEL_02 // GRAVITY", desc: "STRESS TESTING POINT-GRAVITY NODES...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
            3: { title: "LEVEL_03 // WIND", desc: "INTEGRATION OF DIRECTIONAL WIND FIELDS...", video: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
        };

        // --- Verbatim Particle Implementation from Media ID 42e02494-82a2-5292-b9fe-0a02c2dde9b8 ---
        const canvas = document.getElementById('dot-matrix-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = 'rgba(255, 255, 255, ' + (Math.random() * 0.5 + 0.1) + ')';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }
        // --- End of Verbatim Particle Code ---

        function toggleCategory(header) {
            header.classList.toggle('expanded');
        }

        function scrambleText(element, finalString, duration, callback) {
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$';
            const originalText = element.innerText;
            const start = performance.now();
            function update(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                let current = '';
                const finalLength = finalString.length;
                const currentLength = Math.round(originalText.length + (finalLength - originalText.length) * progress);
                for (let i = 0; i < currentLength; i++) {
                    if (Math.random() < progress) current += finalString[i] || '';
                    else current += chars[Math.floor(Math.random() * chars.length)];
                }
                element.innerText = current;
                if (progress < 1) requestAnimationFrame(update);
                else { element.innerText = finalString; if (callback) callback(); }
            }
            requestAnimationFrame(update);
        }

        async function runBootSequence() {
            const bg = document.getElementById('boot-screen-bg');
            const logo = document.getElementById('logo-main');
            const targetChar = document.getElementById('char-target');
            const anchor = document.getElementById('logo-placeholder');
            const bootText = window.innerWidth <= 768 ? 'MOBILE' : 'DESKTOP';

            await sleep(600);
            scrambleText(targetChar, bootText, 800);
            await sleep(1800);

            const rect = anchor.getBoundingClientRect();
            const targetX = rect.left + (rect.width / 2);
            const targetY = rect.top + (rect.height / 2);
            const deltaX = targetX - (window.innerWidth / 2);
            const deltaY = targetY - (window.innerHeight / 2);

            scrambleText(targetChar, '0', 1000);
            logo.style.letterSpacing = '6px';
            logo.style.fontSize = '16px';
            logo.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            await sleep(1000);
            bg.style.opacity = '0';
            document.getElementById('hud-header').classList.add('visible');
            document.getElementById('hud-left').classList.add('visible');
            document.getElementById('hud-center').classList.add('visible');
            document.getElementById('hud-right').classList.add('visible');

            await sleep(1200);
            bg.style.display = 'none';
        }

        function selectProject(id) {
            const items = document.querySelectorAll('.project-item');
            const container = document.getElementById('video-container');
            const title = document.getElementById('project-title');
            const desc = document.getElementById('project-desc');
            const video = document.getElementById('main-video');
            const source = document.getElementById('video-src');
            const closeBtn = document.getElementById('close-trigger');

            items.forEach(item => {
                const itemId = parseInt(item.getAttribute('data-id'));
                item.classList.remove('active');
                if (itemId === id) item.classList.add('active');
            });

            const data = projects[id];
            title.innerText = data.title;
            desc.innerText = data.desc;
            source.src = data.video;
            
            canvas.style.opacity = '0.2';
            container.style.display = 'flex';
            title.style.display = 'block';
            desc.style.display = 'block';
            
            setTimeout(() => {
                container.style.opacity = '1';
                title.style.opacity = '1';
                desc.style.opacity = '1';
                closeBtn.classList.add('active');
            }, 50);
            
            video.load(); video.play();
            document.getElementById('play-pause').innerText = '[PAUSE]';
        }

        function closeProject() {
            const container = document.getElementById('video-container');
            const title = document.getElementById('project-title');
            const desc = document.getElementById('project-desc');
            const video = document.getElementById('main-video');
            const closeBtn = document.getElementById('close-trigger');

            container.style.opacity = '0'; title.style.opacity = '0'; desc.style.opacity = '0';
            closeBtn.classList.remove('active');
            canvas.style.opacity = '1.0';
            document.querySelectorAll('.project-item').forEach(i => i.classList.remove('active'));
            video.pause();

            setTimeout(() => {
                container.style.display = 'none'; title.style.display = 'none'; desc.style.display = 'none';
            }, 800);
        }

        const video = document.getElementById('main-video');
        const playBtn = document.getElementById('play-pause');
        const muteBtn = document.getElementById('mute-toggle');
        const seekFill = document.getElementById('seekbar-fill');

        function togglePlay() {
            if (video.paused) { video.play(); playBtn.innerText = '[PAUSE]'; }
            else { video.pause(); playBtn.innerText = '[PLAY]'; }
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.innerText = video.muted ? 'UNMUTE' : 'MUTE';
        }

        video.addEventListener('timeupdate', () => {
            const pct = (video.currentTime / video.duration) * 100;
            seekFill.style.width = `${pct}%`;
            document.getElementById('time-cur').innerText = formatTime(video.currentTime);
        });

        video.addEventListener('loadedmetadata', () => {
            document.getElementById('time-total').innerText = formatTime(video.duration);
        });

        function seek(e) {
            const rect = document.getElementById('seekbar-root').getBoundingClientRect();
            video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        }

        function formatTime(s) {
            const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        window.onload = () => {
            initParticles();
            animate();
            runBootSequence();
        };

        window.onresize = () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initParticles();
        };
    </script>
</body>
</html>
