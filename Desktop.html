<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB-0 | Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

<script>
(function() {
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile || window.innerWidth < 768) {
    window.location.replace("Mobile.html");
  }
})();
</script>

<style>
:root {
  --bg-color: #050505;
  --overlay-bg: rgba(5, 5, 5, 0.9);
  --white: #ffffff;
  --grid-color: #ffffff;
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
  --font-mono: "Space Mono", monospace;
  --ease: cubic-bezier(0.8, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  border-radius: 0 !important;
}

body, html {
  width: 100%;
  height: 100%;
  background-color: var(--bg-color);
  color: var(--white);
  overflow: hidden;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#dot-matrix-canvas {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

#bg-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  z-index: 1;
  pointer-events: none;
}

.ui-grid {
  position: fixed;
  inset: 20px;
  border: 1px solid var(--grid-color);
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease-out;
  z-index: 5;
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  pointer-events: none;
}

#wordmark {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-header);
  font-weight: 700;
  font-size: 1.1rem;
  white-space: nowrap;
  letter-spacing: 0.05em;
  transform: scale(3.3);
  transition: transform 1.2s var(--ease), opacity 0.8s ease;
  opacity: 1;
}

.ab0-reveal {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1.2s var(--ease), opacity 0.6s var(--ease);
  opacity: 0;
}

#wordmark.assembled .ab0-reveal {
  opacity: 1;
  clip-path: inset(0 0 0 0) !important;
}

#wordmark.docked {
  transform: translate(calc(-50vw + 60px + 1.2em), calc(-50vh + 45px + 0.2em)) scale(1);
  pointer-events: auto;
}

.desktop-icon {
  width: 1em;
  height: 1em;
  margin-left: 4px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

.menu-items {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  padding-left: 20px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s var(--ease);
}

#wordmark.docked .menu-items.visible {
  pointer-events: auto;
  opacity: 1;
}

.menu-item {
  color: var(--white);
  text-decoration: none;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  margin-right: 20px;
  text-transform: uppercase;
  cursor: pointer;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 1s var(--ease);
  display: flex;
  justify-content: center;
  align-items: center;
}

.overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }

.overlay-frame {
  position: absolute;
  inset: 40px;
  border: 1px solid #ffffff;
  pointer-events: none;
}

.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 9px;
  color: #ffffff;
  letter-spacing: 0.1em;
}

.coord-tl { top: -18px; left: 0; }
.coord-br { bottom: -18px; right: 0; }

.content-grid {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 800px;
  padding: 40px;
}

.col-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-right: 40px;
  border-right: 1px solid #ffffff;
}

.avatar {
  width: 110px;
  height: 110px;
  border: 1px solid #ffffff;
  background: #000;
}

.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.username {
  margin-top: 15px;
  font-family: var(--font-header);
  font-size: 0.9rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.col-right {
  display: flex;
  flex-direction: column;
  padding-left: 40px;
  gap: 20px;
  font-family: var(--font-mono);
}

.info-item { display: flex; flex-direction: column; gap: 4px; }
.info-label { font-size: 9px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
.info-value { font-size: 0.85rem; letter-spacing: 0.5px; line-height: 1.4; text-transform: uppercase; }

.mail-link {
  color: var(--white);
  text-decoration: underline;
  font-size: 0.8rem;
  text-transform: none;
}

#projects-overlay:not(.has-content) .overlay-frame,
#projects-overlay:not(.has-content) .coord {
  display: none;
}

.ui-visible { opacity: 1 !important; }
</style>
</head>
<body>

<canvas id="dot-matrix-canvas"></canvas>
<div id="bg-overlay"></div>
<div class="ui-grid" id="grid"></div>

<div class="stage">
  <div id="wordmark">
    <a id="nav-home" style="color: inherit; text-decoration: none; display: flex; align-items: center; cursor: pointer;">
      <span>L</span><span class="ab0-reveal">AB-<svg class="desktop-icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></span>
    </a>
    <div class="menu-items" id="menu">
      <a id="projects-trigger" class="menu-item">PROJECTS</a>
      <a id="about-trigger" class="menu-item">ABOUT</a>
    </div>
  </div>
</div>

<div id="projects-overlay" class="overlay">
  <div class="overlay-frame"><span class="coord coord-tl">[1111, 1111]</span></div>
  <div class="content-grid"></div>
</div>

<div id="about-overlay" class="overlay">
  <div class="overlay-frame"><span class="coord coord-tl">[0000, 0000]</span><span class="coord coord-br">[8888, 8888]</span></div>
  <div class="content-grid">
    <div class="col-left">
      <div class="avatar"><img src="https://github.com/ephemeralgaze.png" alt="ephemeralgaze"></div>
      <div class="username">Jiang</div>
    </div>
    <div class="col-right">
      <div class="info-item"><span class="info-label">Status</span><span class="info-value">Age 21 / Born 2004</span></div>
      <div class="info-item"><span class="info-label">Education</span><span class="info-value">College Degree / JLTC</span></div>
      <div class="info-item"><span class="info-label">Contact</span><a href="mailto:zgnx4ndcq5@privaterelay.appleid.com" class="mail-link">zgnx4ndcq5@privaterelay.appleid.com</a></div>
    </div>
  </div>
</div>

<script>
(function() {
  var canvas = document.getElementById("dot-matrix-canvas");
  var ctx = canvas.getContext("2d");
  var dots = [];
  var width, height, dpr;
  function init() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width * dpr; canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    dots = [];
    for (var i = 0; i < width/30; i++) {
      for (var j = 0; j < height/30; j++) {
        dots.push({x: i*30+15, y: j*30+15, phase: Math.random()*Math.PI*2, freq: 0.02+Math.random()*0.03, maxOpacity: 0.15});
      }
    }
  }
  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    dots.forEach(function(dot) {
      var opacity = (Math.sin(time*0.001*dot.freq*100+dot.phase)*0.5+0.5)*dot.maxOpacity;
      ctx.beginPath(); ctx.arc(dot.x, dot.y, 1, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,"+opacity.toFixed(3)+")"; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", init); init(); requestAnimationFrame(draw);
})();

document.addEventListener("DOMContentLoaded", function() {
  var wordmark = document.getElementById("wordmark");
  var grid = document.getElementById("grid");
  var menu = document.getElementById("menu");
  var navHome = document.getElementById("nav-home");
  var projectsTrigger = document.getElementById("projects-trigger");
  var aboutTrigger = document.getElementById("about-trigger");
  var projectsOverlay = document.getElementById("projects-overlay");
  var aboutOverlay = document.getElementById("about-overlay");

  setTimeout(function() { wordmark.classList.add("assembled"); }, 1000);
  setTimeout(function() { wordmark.classList.add("docked"); }, 2500);
  setTimeout(function() { grid.classList.add("ui-visible"); menu.classList.add("visible"); }, 3700);

  projectsTrigger.onclick = function() { aboutOverlay.classList.remove("active"); projectsOverlay.classList.add("active"); };
  aboutTrigger.onclick = function() { projectsOverlay.classList.remove("active"); aboutOverlay.classList.add("active"); };
  navHome.onclick = function() { projectsOverlay.classList.remove("active"); aboutOverlay.classList.remove("active"); };
});
</script>
</body>
</html>
