<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB-0 | MOBILE TELEMETRY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --fg: #FFFFFF; --border: 1px solid rgba(255, 255, 255, 0.15); --font-header: 'Space Grotesk', sans-serif; --font-mono: 'Space Mono', monospace; --terminal-green: #00FF00; }
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        body { background-color: var(--bg); color: var(--fg); font-family: var(--font-mono); width: 100vw; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
        header { border-bottom: var(--border); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 8px; letter-spacing: 2px; font-family: 'Space Grotesk'; text-transform: uppercase; }
        .nav-scroller { display: flex; overflow-x: auto; border-bottom: var(--border); background: #111; }
        .nav-item { flex: 0 0 auto; padding: 12px 20px; font-size: 9px; text-transform: uppercase; opacity: 0.4; border-right: 1px solid #222; }
        .nav-item.active { opacity: 1; background: #1a1a1a; }
        .module-content { display: none; flex: 1; flex-direction: column; }
        .module-content.active { display: flex; }
        .canvas-container { height: 280px; width: 100%; position: relative; border-bottom: var(--border); }
        #niagara-canvas { width: 100%; height: 100%; }
        .details-panel { background: #111; flex: 1; }
        .category-header { background: #2A2A2A; padding: 8px 15px; font-size: 9px; font-weight: bold; border-bottom: 1px solid #111; }
        .detail-row { padding: 10px 15px; }
        .detail-label { font-size: 8px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        .input-group { display: flex; align-items: center; background: #000; border: 1px solid #333; }
        .input-prefix { font-size: 8px; padding: 0 6px; color: #555; border-right: 1px solid #333; }
        .detail-input { width: 100%; background: transparent; border: none; color: #FFF; font-family: var(--font-mono); font-size: 11px; padding: 8px; outline: none; }
        .detail-slider { -webkit-appearance: none; width: 100%; height: 1px; background: #444; outline: none; margin: 10px 0; }
        .detail-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 20px; background: #FFF; }
        .obj-toggle { display: flex; padding: 10px; gap: 5px; }
        .obj-btn { flex: 1; padding: 8px; font-size: 8px; background: #222; border: 1px solid #333; color: #777; text-align: center; }
        .obj-btn.active { color: #FFF; background: #333; border-color: #555; }
        .video-placeholder { height: 180px; border: 1px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 9px; color: rgba(255,255,255,0.3); }
        .goal-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; color: var(--terminal-green); background: #000; border: 1px solid var(--terminal-green); padding: 5px 10px; display: none; pointer-events: none; }
    </style>
</head>
<body>
    <header><h1>LAB-0 // MOBILE</h1><div id="sim-status" style="font-size: 8px; color: #00FF00;">READY</div></header>
    <div class="nav-scroller"><div class="nav-item active" onclick="switchModule('01')">Module 01</div><div class="nav-item" onclick="switchModule('02')">Module 02</div></div>
    <div id="module-01" class="module-content active">
        <div class="canvas-container"><canvas id="niagara-canvas"></canvas><div id="goal-notification" class="goal-text">GOAL_REACHED</div></div>
        <div class="obj-toggle"><div id="btn-deflector" class="obj-btn active" onclick="selectObject('deflector')">DEFLECTOR</div></div>
        <section class="details-panel"><div class="category-header">TRANSFORM</div><div class="detail-row"><div class="detail-label">Position X</div><div class="input-group"><span class="input-prefix">X</span><input type="number" id="posX" class="detail-input"></div><input type="range" id="posX-slider" class="detail-slider" min="0" max="400"></div><div class="detail-row"><div class="detail-label">Position Y</div><div class="input-group"><span class="input-prefix">Y</span><input type="number" id="posY" class="detail-input"></div><input type="range" id="posY-slider" class="detail-slider" min="0" max="300"></div></section>
    </div>
    <div id="module-02" class="module-content"><div style="padding:20px;"><div class="video-placeholder">[ VIDEO_NOT_FOUND ]</div><div class="category-header">NIAGARA_TECH</div><p style="font-size:9px; color:#888;">Emitter: NS_Fountain_01</p></div></div>
    <script>
        function switchModule(id) {
            document.querySelectorAll('.module-content').forEach(m => m.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('module-' + id).classList.add('active');
            event.currentTarget.classList.add('active'); if(id === '01') resize();
        }
        const canvas = document.getElementById('niagara-canvas'); const ctx = canvas.getContext('2d'); const goalNotif = document.getElementById('goal-notification');
        let particles = []; let goalHits = 0; let activeObjKey = 'deflector';
        let gameState = { deflector: { x: 150, y: 100 }, goal: { x: 250, y: 180, w: 50, h: 50 } };
        const ui = { posX: document.getElementById('posX'), posY: document.getElementById('posY'), posXs: document.getElementById('posX-slider'), posYs: document.getElementById('posY-slider') };
        function selectObject(key) { activeObjKey = key; syncUIFromState(); }
        function syncUIFromState() { const obj = gameState[activeObjKey]; ui.posX.value = ui.posXs.value = Math.round(obj.x); ui.posY.value = ui.posYs.value = Math.round(obj.y); }
        function syncStateFromUI(source) {
            const obj = gameState[activeObjKey];
            if (source.includes('s')) { obj.x = parseInt(ui.posXs.value); obj.y = parseInt(ui.posYs.value); }
            else { obj.x = parseInt(ui.posX.value) || 0; obj.y = parseInt(ui.posY.value) || 0; }
            syncUIFromState();
        }
        Object.keys(ui).forEach(k => ui[k].addEventListener('input', () => syncStateFromUI(k)));
        function resetLevel() { particles = []; for (let i = 0; i < 30; i++) particles.push(new Particle()); goalHits = 0; syncUIFromState(); }
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = 20; this.y = 20; this.vx = 1.5 + Math.random(); this.vy = 0.5 + Math.random(); }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.05; if (this.y > canvas.height || this.x > canvas.width || this.x < 0) this.reset(); }
            draw() { ctx.fillStyle = "#FFF"; ctx.fillRect(this.x, this.y, 1, 1); }
        }
        function resize() { if(document.getElementById('module-01').classList.contains('active')) { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; resetLevel(); } }
        window.addEventListener('resize', resize);
        function animate() {
            if(document.getElementById('module-01').classList.contains('active')) {
                ctx.fillStyle = 'rgba(5,5,5,0.4)'; ctx.fillRect(0,0,canvas.width, canvas.height);
                ctx.strokeStyle = goalHits > 15 ? "#00FF00" : "#FFF"; ctx.strokeRect(gameState.goal.x, gameState.goal.y, gameState.goal.w, gameState.goal.h);
                particles.forEach(p => { p.update(); p.draw(); });
            }
            requestAnimationFrame(animate);
        }
        resize(); animate();
    </script>
</body>
</html>
