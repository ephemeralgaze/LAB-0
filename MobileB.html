<style>
:root {
  --bg-color: #050505;
  --overlay-bg: rgba(5, 5, 5, 0.7);
  --white: #ffffff;
  --grid-color: #ffffff;
  --font-header: "Syncopate", sans-serif;
  --font-body: "Space Grotesk", sans-serif;
  --font-mono: "Space Mono", monospace;
  --ease: cubic-bezier(0.8, 0, 0.2, 1);
}

@media (dynamic-range: high) or (color-gamut: p3) {
  :root {
    --white: color(display-p3 1 1 1);
    --grid-color: #ffffff;
  }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  width: 100%;
  height: 100%;
  background-color: var(--bg-color);
  color: var(--white);
  overflow: hidden;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#dot-matrix-canvas {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

#bg-overlay {
  position: fixed;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1;
  pointer-events: none;
}

.ui-grid {
  position: fixed;
  inset: 0;
  border: 1px solid #ffffff;
  margin: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s ease-out;
  z-index: 5;
  border-color: var(--grid-color);
}

.stage {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  pointer-events: none;
}

#wordmark {
  position: absolute;
  top: 50%;
  left: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-header);
  font-weight: 700;
  font-size: 1.5rem;
  height: 24px;
  line-height: 24px;
  white-space: nowrap;
  letter-spacing: 0;
  transform: translate(-50%, -50%) scale(3.3333);
  transition: transform 1.2s var(--ease), top 1.2s var(--ease), left 1.2s var(--ease), opacity 0.8s ease;
  will-change: transform, top, left;
  opacity: 1;
  width: auto;
  overflow: visible;
}

.l-char {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 24px;
  line-height: 24px;
}

.ab0-reveal {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  white-space: nowrap;
  clip-path: inset(0 100% 0 0) !important;
  opacity: 0;
  visibility: hidden;
  transition: clip-path 1.2s var(--ease), opacity 0.6s var(--ease), visibility 0.4s var(--ease);
  will-change: clip-path;
  height: 24px;
  line-height: 24px;
}

#wordmark.docked {
  top: 37px;
  left: 30px;
  transform: translate(0, -50%) scale(0.85);
  pointer-events: auto;
}

#wordmark.docked-final .ab0-reveal {
  opacity: 1 !important;
  visibility: visible !important;
  clip-path: inset(0 0 0 0) !important;
}

.mobile-icon {
  width: 1.1em;
  height: 1.1em;
  margin-left: 0.08em;
  flex-shrink: 0;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  display: block;
}

#mobile-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 74px;
  background: #050505;
  z-index: 10002;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s var(--ease), visibility 0.6s var(--ease);
}

#mobile-header.active {
  opacity: 1;
  visibility: visible;
}

#mobile-header::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 40px;
  background: linear-gradient(to bottom, #050505 0%, rgba(5, 5, 5, 0) 100%);
  pointer-events: none;
}

.hamburger {
  position: fixed;
  top: 0;
  right: 30px;
  width: 24px;
  height: 74px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  z-index: 10003;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease-out;
}

.hamburger.ui-visible {
  opacity: 1;
  pointer-events: auto;
}

.hamburger-inner {
  width: 100%;
  height: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hamburger span {
  display: block;
  width: 100%;
  height: 1px;
  background-color: var(--white);
  border-radius: 0 !important;
  transition: transform 0.4s var(--ease), opacity 0.4s var(--ease);
}

.hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-nav-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-color);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 40px;

  transition: transform 0.6s var(--ease);
  pointer-events: auto;
}

.mobile-nav-overlay.open {
  transform: translateX(0);
}

.mobile-menu-item {
  font-family: var(--font-header);
  font-size: 1.2rem;
  letter-spacing: 0.3em;
  color: var(--white);
  text-decoration: none;
  text-transform: uppercase;
  opacity: 0.6;
  transition: opacity 0.3s ease;
}

.mobile-menu-item.active { opacity: 1; }

.ui-visible { opacity: 1 !important; }

.overlay {
  position: fixed;
  inset: 0;
  background: #050505;
  z-index: 200;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 1.2s var(--ease), visibility 1.2s var(--ease);

  justify-content: center;
  align-items: flex-start;
  overflow-y: auto;
}

.overlay.active {
  opacity: 1;

  pointer-events: auto;
}

.overlay-frame {

  border: 1px solid #ffffff;
  pointer-events: none;
}

.coord {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 10px;
  color: #ffffff;
  letter-spacing: 0.1em;
}
@media (dynamic-range: high) or (color-gamut: p3) {

}
.coord-tl { top: -20px; left: 0; }
.coord-br { bottom: -20px; right: 0; }

.content-grid {

.username {

}

.col-right {

}

.info-item {

  letter-spacing: 0.1em;

}
@media (dynamic-range: high) or (color-gamut: p3) {

.info-icon {

}

.info-label {

}
@media (dynamic-range: high) or (color-gamut: p3) {

.info-value {

.mail-link {

@media (orientation: landscape) and (max-height: 500px) {
 
  #mobile-header.active {

    visibility: hidden !important;
    pointer-events: none !important;
  }

  
  #projects-overlay.active ~ .stage #wordmark.docked,
  #about-overlay.active ~ .stage #wordmark.docked {
    transform: translate(-200%, -50%) scale(0.8) !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }

 
  .hamburger {
    top: 20px !important;
    right: 30px;
    height: 24px;
    transition: transform 0.4s var(--ease), right 0.4s var(--ease), opacity 0.4s ease !important;
    z-index: 10005;
  }
  #projects-overlay.active ~ #hamburger,
  #about-overlay.active ~ #hamburger {

  }


  #projects-overlay.active ~ #hamburger span:nth-child(1),
  #about-overlay.active ~ #hamburger span:nth-child(1) {
    transform: translate(-3px, 3px) rotate(-45deg) scaleX(0.55) !important;
    transform-origin: left center !important;
  }
  

  #projects-overlay.active ~ #hamburger span:nth-child(2),
  #about-overlay.active ~ #hamburger span:nth-child(2) {
    opacity: 0 !important;
    transform: scaleX(0) !important;
  }
  

  #projects-overlay.active ~ #hamburger span:nth-child(3),
  #about-overlay.active ~ #hamburger span:nth-child(3) {

  #projects-overlay .content-grid {

  }
  #about-overlay .avatar {

  }
}

<script>
(function() {
  var canvas = document.getElementById("dot-matrix-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var dots = [];
  var width, height, dpr;

  var GRID_SIZE = 30;
  var DOT_RADIUS = 1.2;

  function init() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
    
    dots = [];
    var cols = Math.ceil(width / GRID_SIZE);
    var rows = Math.ceil(height / GRID_SIZE);

    for (var i = 0; i < cols; i++) {
      for (var j = 0; j < rows; j++) {
        dots.push({
          x: i * GRID_SIZE + GRID_SIZE / 2,
          y: j * GRID_SIZE + GRID_SIZE / 2,
          phase: Math.random() * Math.PI * 2,
          freq: 0.02 + Math.random() * 0.03,
          maxOpacity: 0.02 + Math.random() * 0.28
        });
      }
    }
  }

  function draw(time) {
    ctx.clearRect(0, 0, width, height);
    
    dots.forEach(function(dot) {
      var opacity = (Math.sin(time * 0.001 * dot.freq * 100 + dot.phase) * 0.5 + 0.5) * dot.maxOpacity;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 255, 255, " + opacity.toFixed(3) + ")";
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", init);
  init();
  requestAnimationFrame(draw);
})();

document.addEventListener("DOMContentLoaded", function() {
  var wordmark = document.getElementById("wordmark");
  var grid = document.getElementById("grid");
  var navHome = document.getElementById("nav-home");
  var aboutOverlay = document.getElementById("about-overlay");
  var projectsOverlay = document.getElementById("projects-overlay");

  var hamburger = document.getElementById("hamburger");
  var mobileNav = document.getElementById("mobile-nav");
  var mNavHome = document.getElementById("m-nav-home");
  var mProjectsTrigger = document.getElementById("m-projects-trigger");
  var mAboutTrigger = document.getElementById("m-about-trigger");
  var mobileHeader = document.getElementById("mobile-header");

  setTimeout(function() { 
    if (wordmark) wordmark.classList.add("docked");
  }, 3500);

  if (wordmark) {
    wordmark.addEventListener("transitionend", function(e) {
      if (e.propertyName === "top" || e.propertyName === "transform") {
        if (wordmark.classList.contains("docked") && !wordmark.classList.contains("docked-final")) {
          if (grid) grid.classList.add("ui-visible");
          if (hamburger) hamburger.classList.add("ui-visible");
          wordmark.classList.add("docked-final");
        }
      }
    });
  }

  var navItems = [navHome, mNavHome, mProjectsTrigger, mAboutTrigger];

  var setActiveNav = function(activeEl) {
    navItems.forEach(function(item) { if (item) item.classList.remove("active"); });
    if (activeEl) activeEl.classList.add("active");
  };

  setActiveNav(navHome);

  var switchPage = function(pageId, triggerEl) {
    setActiveNav(triggerEl);
    if (aboutOverlay) aboutOverlay.classList.remove("active");
    if (projectsOverlay) projectsOverlay.classList.remove("active");
    if (mobileHeader) mobileHeader.classList.remove("active");

    if (pageId === "about") {
      if (aboutOverlay) aboutOverlay.classList.add("active");
      if (mobileHeader) mobileHeader.classList.add("active");
    } else if (pageId === "projects") {
      if (projectsOverlay) projectsOverlay.classList.add("active");
      if (mobileHeader) mobileHeader.classList.add("active");
    }
    if (hamburger) hamburger.classList.remove("open");
    if (mobileNav) mobileNav.classList.remove("open");
  };

  if (hamburger) {
    hamburger.addEventListener("click", function() {
      hamburger.classList.toggle("open");
      mobileNav.classList.toggle("open");
    });
  }

  if (navHome) navHome.addEventListener("click", function(e) { e.stopPropagation(); switchPage("home", navHome); });
  if (mAboutTrigger) mAboutTrigger.addEventListener("click", function() { switchPage("about", mAboutTrigger); });
  if (mProjectsTrigger) mProjectsTrigger.addEventListener("click", function() { switchPage("projects", mProjectsTrigger); });
  if (mNavHome) mNavHome.addEventListener("click", function() { switchPage("home", mNavHome); });
});
</script>
